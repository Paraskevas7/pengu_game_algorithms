name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The docs/ folder is up to date with www/
        run: |
          python3 tools/build.py
          git diff --exit-code -- docs || (echo "Run 'python3 tools/build.py' and commit docs/." && exit 1)
