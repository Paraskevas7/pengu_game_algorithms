<title>CS Penguins</title>
<style>
:root {
  color-scheme: dark; --bg1: #0b1d33; --bg2: #1f4e79; --card: rgba(255,255,255,.09); --ice: #d9f2fc; --ice2: #9ad6f0;
  --water: #174a7c; --gold: #ffcf3f; --good: #4ade80; --bad: #ff6b6b; --text: #f2faff; --muted: #9fc4de;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background-color: var(--bg1); background-image: linear-gradient(180deg, var(--bg1), var(--bg2)); background-attachment: fixed; color: var(--text);
  font-family: -apple-system, "SF Pro Rounded", "Segoe UI", Roboto, system-ui, sans-serif; overscroll-behavior: none; }

#app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 16px; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }

/* Menu */
.hero { text-align: center; padding: 8px 0 16px; }
.hero svg { width: 84px; animation: waddle 1.4s ease-in-out infinite; transform-origin: 50% 100%; }
.hero h1 { font-size: 34px; letter-spacing: .5px; margin-top: 6px; }
.hero p { color: var(--muted); margin-top: 4px; }
@keyframes waddle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
.card { background: var(--card); border-radius: 20px; padding: 14px; margin-bottom: 14px; backdrop-filter: blur(6px); }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.card-head .big { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; }
.card-head .big svg { width: 100%; height: 100%; }
.card-head > div { flex: 1; min-width: 0; }
.card-head h2 { font-size: 20px; }
.sub { color: var(--muted); font-size: 13px; }
.ghost { background: rgba(255,255,255,.14); padding: 8px 12px; border-radius: 999px; font-size: 13px; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lvl { background: var(--ice); color: #0b2a44; border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 4px 0 var(--ice2); }
.lvl b { font-size: 24px; display: flex; align-items: center; height: 30px; }
.lvl .stars { color: #e8a800; font-size: 15px; letter-spacing: 2px; }
.lvl.locked { background: rgba(255,255,255,.12); color: var(--muted); box-shadow: none; }
.foot { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 0 24px; }

/* Level screen */
.topbar { display: flex; align-items: center; gap: 10px; }
.topbar .ttl { flex: 1; text-align: center; }
.topbar .ttl b { display: block; font-size: 18px; }
.topbar .ttl small { color: var(--muted); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.14); font-size: 20px; }
.modebar { display: flex; gap: 8px; margin: 14px 0 10px; align-items: center; }
.modebar button { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 14px; }
.modebar button.on { background: var(--gold); color: #3a2a00; font-weight: 700; }
.modebar .mist { margin-left: auto; color: var(--muted); font-size: 14px; }

/* Graph board */
.board { margin: 0 auto; position: relative; }
.grid { display: grid; gap: 4px; max-width: 420px; margin: 0 auto; }
.tile { aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative;
  background: var(--ice); color: #0b2a44; font-weight: 700; font-size: clamp(12px, 3.6vw, 17px); user-select: none; }
.tile.wall { background: repeating-linear-gradient(135deg, var(--water) 0 8px, #1b5a94 8px 16px); }
.tile.visited { background: var(--ice2); }
.tile.path { background: #b7f5c8; box-shadow: inset 0 0 0 3px var(--good); }
.tile.frontier { background: #fff6cc; box-shadow: inset 0 0 0 3px var(--gold); animation: pulse 1.2s ease-in-out infinite; cursor: pointer; }
.tile.next { box-shadow: inset 0 0 0 4px #ff9f1c; }
.tile.wrong { animation: shake .35s; background: #ffd4d4; }
.tile .em { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.tile .em svg { width: 74%; height: auto; }
.tile .num { position: absolute; right: 4px; bottom: 1px; font-size: 10px; opacity: .7; }
@keyframes pulse { 50% { transform: scale(.94); } }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

.panel { margin-top: 12px; background: var(--card); border-radius: 16px; padding: 10px 12px; min-height: 72px; }
.panel h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--gold); color: #3a2a00; border-radius: 10px; padding: 4px 10px; font-weight: 700; font-size: 14px; }
.ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 6px; }
.msg { margin: 12px 2px; min-height: 48px; line-height: 1.35; font-size: 15px; }
.msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
.controls { display: flex; gap: 10px; flex-wrap: wrap; padding-bottom: 20px; }
.btn { flex: 1; min-width: 120px; padding: 14px 16px; border-radius: 16px; background: var(--ice); color: #0b2a44; font-weight: 700; font-size: 16px; box-shadow: 0 4px 0 var(--ice2); }
.btn.primary { background: var(--gold); color: #3a2a00; box-shadow: 0 4px 0 #c99a00; }
.btn:active { transform: translateY(2px); box-shadow: none; }

/* Quick sort board */
.board.qs { width: 100%; max-width: 440px; position: relative; margin-top: 8px; border-bottom: 3px solid rgba(255,255,255,.35); }
.pgn { position: absolute; left: 0; bottom: 22px; transition: transform .5s cubic-bezier(.3,1.4,.5,1), opacity .3s, filter .3s; }
.pgn svg { display: block; width: 100%; height: auto; }
.pgn::after { content: attr(data-tag); position: absolute; left: 50%; transform: translateX(-50%); bottom: -20px; font-size: 11px; font-weight: 700; color: var(--gold); white-space: nowrap; }
.pgn.dim { opacity: .35; filter: grayscale(.6); }
.pgn.cur { filter: drop-shadow(0 0 8px #7ee8ff) drop-shadow(0 0 3px #fff); animation: hop .8s ease-in-out infinite; }
.pgn.pivot { filter: drop-shadow(0 0 8px var(--gold)); }
.pgn.final { filter: drop-shadow(0 0 7px var(--good)); }
.pgn.wrong { animation: shake .35s; }
@keyframes hop { 50% { margin-bottom: 8px; } }

.result { background: var(--card); border-radius: 20px; padding: 16px; width: 100%; text-align: center; }
.result .bigstars { font-size: 44px; color: var(--gold); letter-spacing: 6px; margin: 4px 0; }
.result p { color: var(--muted); margin-bottom: 12px; line-height: 1.35; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Modal */
.modal { position: fixed; inset: 0; background: rgba(4,12,22,.78); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
.modal .sheet { background: #12304f; border-radius: 22px; padding: 20px; max-width: 460px; width: 100%; max-height: 85vh; overflow: auto; }
.modal h3 { font-size: 22px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.modal h3 svg { width: 34px; height: 34px; flex: none; }
.modal p { line-height: 1.45; margin-bottom: 12px; color: #dbeefa; }
.modal pre { background: rgba(0,0,0,.35); border-radius: 12px; padding: 12px; font-size: 13px; overflow: auto; margin: 0 0 14px; line-height: 1.5; }

/* ---------- Menu extras ---------- */
.hero .how { max-width: 34ch; margin: 8px auto 0; font-size: 14px; line-height: 1.4; }
.ghost.primary { background: var(--gold); color: #3a2a00; font-weight: 700; }
.blurb { color: #dbeefa; margin: -2px 2px 12px; font-size: 14px; line-height: 1.4; }
.soon { color: var(--muted); font-size: 13px; margin: 0 2px 2px; }
.card-head .big svg { width: 100%; height: 100%; }

/* ---------- Lesson pages ---------- */
:root { --pink: #ff9aa8; --cream: #ffe3a3; }
#app.wide { max-width: 860px; }
.topbar .ghost, .topbar .topspace { flex: none; min-width: 40px; }
.lesson { display: grid; gap: 18px; margin-top: 14px; }
.lesson h2 { margin: 0 0 6px; font-size: 22px; color: var(--cream); text-wrap: balance; }
.lesson h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.lesson h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.lesson .card { margin: 0; min-width: 0; }
.t-white { color: #fff; font-size: 17px; line-height: 1.6; max-width: 62ch; margin: 0 0 12px; }
.t-pink { color: var(--pink); font-size: 18px; line-height: 1.5; margin: 0; font-weight: 600; }
.hint { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 12px; }

.intro { display: flex; gap: 12px; align-items: flex-end; }
.pip { width: 56px; flex: none; }
.pip svg { width: 100%; height: auto; display: block; animation: waddle 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
.bubble { position: relative; background: var(--card); border-radius: 18px 18px 18px 4px; padding: 12px 16px; flex: 1; min-width: 0; }

.player { padding: 14px; }
.stage { min-height: 60px; }
.gsvg { width: 100%; height: auto; display: block; max-height: 360px; margin: 0 auto; }
.ge { stroke: #7f9cbc; stroke-width: 3; stroke-linecap: round; }
.ge.tree { stroke: var(--gold); stroke-width: 5; }
.ge.active:not(.tree):not(.rej) { stroke: #fff; stroke-width: 4; stroke-dasharray: 6 6; }
.ge.rej { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 3 7; opacity: .9; }
.ge.path { stroke: var(--good); stroke-width: 7; }
.wt rect { fill: #17304d; stroke: #7f9cbc; stroke-width: 1.5; }
.wt text { fill: #fff; font: 700 12px system-ui, sans-serif; text-anchor: middle; }
.gn circle { fill: #dbeefa; stroke: #8fb7d6; stroke-width: 3; }
.gn.seen circle { fill: #7ec7ea; stroke: #4a9cc7; }
.gn.wait circle { stroke: var(--gold); stroke-width: 5; }
.gn.cur circle { fill: var(--gold); stroke: #fff; stroke-width: 4; }
.gn.new circle { animation: flash2 .8s; }
.gn .nl { fill: #0b2a44; font: 800 17px system-ui, sans-serif; text-anchor: middle; }
@keyframes flash2 { from { fill: #fff; } }
.lbl { fill: var(--muted); font: 600 10px system-ui, sans-serif; text-anchor: middle; }
.ord circle { fill: #27405f; stroke: #9ad6f0; stroke-width: 1.5; }
.ord text { fill: #fff; font: 700 10px system-ui, sans-serif; text-anchor: middle; }
.dl { fill: var(--pink); font: 800 15px system-ui, sans-serif; }
.dl.upd { fill: #fff; }
.fromarrow { fill: var(--gold); stroke: #7a5a00; stroke-width: .8; }

.panel { margin-top: 12px; background: rgba(255,255,255,.07); border-radius: 14px; padding: 10px 12px; }
.panel h4 { margin: 0 0 6px; }
.line { display: flex; gap: 6px; flex-wrap: wrap; min-height: 58px; align-items: flex-end; padding-top: 10px; }
.line .empty { color: var(--muted); font-size: 13px; align-self: center; }
.ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 6px; gap: 8px; }
.pchip { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 700; }
.pchip svg { width: 26px; height: auto; display: block; }
.pchip.out { box-shadow: 0 0 0 2px var(--gold); }
.pchip.out::after { content: "out"; position: absolute; top: -10px; font-size: 10px; background: var(--gold); color: #3a2a00; border-radius: 6px; padding: 0 5px; }
.pchip.new { animation: pop .5s; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.dtab { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.dtab th, .dtab td { text-align: left; padding: 4px 8px; }
.dtab thead th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.dtab tbody th { font-weight: 800; }
.dtab td:nth-child(2) { color: var(--pink); font-weight: 800; }
.dtab tr.done { background: rgba(126,199,234,.15); }
.dtab tr.cur { background: rgba(255,207,63,.25); }
.dtab tr.upd td:nth-child(2) { color: #fff; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
.sw.gold { background: var(--gold); } .sw.blue { background: #7ee8ff; } .sw.green { background: var(--good); }
.pgn.grp { filter: drop-shadow(0 0 7px #7ee8ff); }

.caption { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 8px; }
.pipsay { width: 30px; flex: none; margin-top: 4px; }
.pipsay svg { width: 100%; height: auto; display: block; }
.said { background: rgba(255,255,255,.1); border-radius: 4px 16px 16px 16px; padding: 10px 14px; min-height: 76px; flex: 1; min-width: 0; line-height: 1.5; font-size: 16px; }
.stepno { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.scrub, .speed input { width: 100%; accent-color: var(--gold); }
.transport { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.tbtn { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; flex: none; }
.tbtn.play { width: 58px; height: 58px; background: var(--gold); color: #3a2a00; }
.tbtn:disabled { opacity: .35; cursor: default; }
.speed { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-left: auto; min-width: 130px; flex: 1 1 130px; max-width: 200px; }
.tbtn:focus-visible, .seg button:focus-visible, .ghost:focus-visible, .icon-btn:focus-visible, .btn:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.examples { margin-top: 16px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { padding: 9px 14px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 14px; }
.seg button.on { background: var(--ice); color: #0b2a44; font-weight: 700; }
.numlabel { display: block; margin: 14px 0 6px; font-size: 14px; color: #dbeefa; }
.numrow { display: flex; gap: 8px; }
.numrow input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 2px solid rgba(255,255,255,.28); background: rgba(0,0,0,.28); color: #fff; font: inherit; font-size: 16px; letter-spacing: 2px; }
.btn.small { flex: none; min-width: 0; padding: 10px 16px; font-size: 15px; }
.numerr { color: var(--bad); min-height: 20px; font-size: 14px; margin: 6px 0 0; }

/* Storyboard */
.storyboard .hint { margin-bottom: 14px; }
.spanel { margin: 0; background: var(--card); border-radius: 20px; padding: 14px; }
.snum { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.spic { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.spic .panel { width: 100%; margin-top: 4px; }
.spanel figcaption { margin-top: 12px; color: #fff; font-size: 16px; line-height: 1.55; }
.arrow { display: flex; justify-content: center; padding: 8px 0; color: var(--pink); }

.srow { display: flex; gap: 4px; align-items: flex-end; justify-content: center; padding-bottom: 24px; border-bottom: 3px solid rgba(255,255,255,.3); width: 100%; }
.sp { width: var(--pw); position: relative; transition: opacity .3s; }
.sp svg { width: 100%; height: auto; display: block; }
.sp::after { content: attr(data-tag); position: absolute; left: 50%; transform: translateX(-50%); bottom: -20px; font-size: 11px; font-weight: 700; color: var(--gold); white-space: nowrap; }
.sp.dim { opacity: .35; filter: grayscale(.6); }
.sp.cur { filter: drop-shadow(0 0 8px #7ee8ff) drop-shadow(0 0 3px #fff); }
.sp.pivot { filter: drop-shadow(0 0 8px var(--gold)); }
.sp.final { filter: drop-shadow(0 0 7px var(--good)); }
.sp.grp { filter: drop-shadow(0 0 7px #7ee8ff); }

.mtree { display: flex; flex-direction: column; gap: 6px; align-items: center; width: 100%; }
.mlabel { align-self: flex-start; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.mrow { display: flex; gap: 5px; justify-content: center; align-items: flex-end; width: 100%; }
.mgrp { display: flex; gap: 2px; align-items: flex-end; padding: 4px; border-radius: 10px; border: 2px solid rgba(255,255,255,.22); background: rgba(255,255,255,.05); }
.mgrp.active { border-color: var(--gold); background: rgba(255,207,63,.16); }
.mgrp.sorted { border-color: rgba(74,222,128,.75); }
.mgrp.ghost { border-style: dashed; opacity: .5; }
.mp { width: var(--mw); display: block; }
.mp svg { width: 100%; height: auto; display: block; }
.mp.ghost { height: var(--mw); }

/* Theory (white text, pink rules, gold result boxes) */
.theory .steps { margin: 0 0 18px; padding-left: 26px; display: grid; gap: 8px; }
.theory .steps li { margin: 0; }
.theory .steps li::marker { color: var(--gold); font-weight: 800; }
.gold-box { border: 3px solid var(--gold); border-radius: 16px; padding: 14px 18px; margin: 0 0 16px; background: rgba(255,207,63,.06); }
.gold-box p { margin: 0; color: #fff; font-size: 18px; line-height: 1.5; font-weight: 600; }
.gold-box.time p { font-weight: 400; font-size: 16px; margin-top: 10px; }
.formula { font-size: 26px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; text-wrap: balance; }
.two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-bottom: 16px; }
.note { background: var(--card); border-radius: 16px; padding: 14px 16px; min-width: 0; }
.note p { margin: 0; }
.codebox { background: var(--card); border-radius: 16px; padding: 12px 16px; }
.codebox summary { cursor: pointer; font-weight: 700; color: var(--cream); padding: 4px 0; }
.codebox .hint { margin-top: 10px; }
.code { list-style: none; margin: 0; padding: 0; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.code li { white-space: pre; padding: 4px 8px; border-left: 3px solid transparent; border-radius: 4px; color: #cfe6f5; }
.code li.on { background: rgba(255,207,63,.2); border-left-color: var(--gold); color: #fff; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Spanning trees + quiz ---------- */
.sw.red { background: var(--bad); }
.elist { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 2px; }
.ech { background: rgba(255,255,255,.1); border: 2px solid transparent; border-radius: 10px; padding: 4px 9px; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ech b { color: #fff; }
.ech.take { border-color: var(--gold); background: rgba(255,207,63,.2); }
.ech.cur { border-color: #fff; }
.ech.skip { border-color: var(--bad); opacity: .6; text-decoration: line-through; }
.quiz { padding: 16px; }
.qprog { display: flex; gap: 6px; margin-bottom: 10px; }
.qprog i { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); }
.qprog i.done { background: var(--good); }
.qprog i.now { background: var(--gold); }
.qpic { margin: 8px 0 14px; min-width: 0; }
.qpic .panel { margin-top: 10px; }
.qtext { margin: 0 0 12px !important; font-size: 20px !important; color: #fff !important; line-height: 1.35; text-wrap: balance; }
.opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opt { padding: 14px 12px; border-radius: 14px; background: rgba(255,255,255,.12); font-size: 17px; font-weight: 700; color: #fff; border: 3px solid transparent; font-variant-numeric: tabular-nums; }
.opt:hover:not(:disabled) { background: rgba(255,255,255,.2); }
.opt.right { border-color: var(--good); background: rgba(74,222,128,.22); }
.opt.wrong { border-color: var(--bad); background: rgba(248,113,113,.2); }
.opt:disabled { cursor: default; }
.opt:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.qfeed { display: grid; gap: 12px; margin-top: 14px; }
.qfeed .said { min-height: 0; border-radius: 12px; }
.qfeed .said.yes { border-left: 5px solid var(--good); }
.qfeed .said.no { border-left: 5px solid var(--bad); }
.quiz.end { text-align: center; padding: 28px 16px; }
.bigscore { font-size: 54px; font-weight: 800; color: var(--cream); font-variant-numeric: tabular-nums; }
.quiz.end .stars { font-size: 30px; color: var(--gold); margin: 4px 0 8px; }
.endbtns { display: grid; gap: 10px; max-width: 320px; margin: 18px auto 0; }
.card-head .quizbest { font-size: 12px; color: var(--muted); }

/* ---------- Menu ---------- */
.quizbtn { width: 100%; padding: 12px; font-size: 16px; font-weight: 700; margin-top: 2px; }
.okmsg { background: rgba(74,222,128,.15); border: 2px solid var(--good); border-radius: 12px; padding: 10px 14px; margin: 0; }
.foot a { color: var(--cream); }
[hidden] { display: none !important; }


.langsw { display: inline-flex; margin-top: 12px; border: 2px solid rgba(255,255,255,.25); border-radius: 999px; overflow: hidden; }
.langsw button { background: transparent; color: var(--cream); border: 0; padding: 8px 16px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 40px; }
.langsw button.on { background: var(--gold); color: #0b1d33; }

/* arrow heads on directed maps */

    "d.hw.note": "Glowing parts are doing the job right now.",
    "f.hw.t0": "A computer works like a busy penguin kitchen. Things come in, get worked on, wait on a desk, can be put away in a cupboard, and come out again. Five parts do these jobs. Watch what happens when you type the letter A.",
    "f.hw.t1": "You press the key A. The keyboard is an input device: it sends your action into the computer. A mouse, a microphone and a touch screen are inputs too.",
    "f.hw.t2": "The CPU is the brain. It follows instructions and does the calculations. It works out that the letter A must appear on the screen.",
    "f.hw.t3": "The letter A waits in memory (RAM). Memory is the quick desk the computer uses for what it is working on right now. It is very fast, but it forgets everything when the power goes off.",
    "f.hw.t4": "The screen is an output device. It shows the letter A to you. Speakers and printers are outputs too.",
    "f.hw.t5": "Input, CPU, memory, output: that is the journey of a letter. Every program, from a game to a calculator, uses these same parts.",
    "f.hw.s0": "Now you are drawing a penguin picture. While you draw, the picture lives in memory, the quick desk. What would happen if the power went off before you save?",
    "f.hw.s1": "You move the mouse and draw. The mouse is an input. The CPU turns every movement into coloured dots.",
    "f.hw.s2": "The picture waits in memory while you work. If the power went off now, the picture would be gone!",
    "f.hw.s3": "You press Save. The CPU copies the picture from memory to storage. Storage is the cupboard: a disk or a flash drive that keeps things even when the power is off.",
    "f.hw.s4": "Tomorrow you open the picture again. It is copied from storage back into memory, and the screen shows it to you.",
    "f.hw.s5": "Storage is big and keeps things. Memory is fast but forgets. That is why you should save your work often!",
    "f.hw.q.in": "Which part is the keyboard?",
    "f.hw.w.in": "The keyboard sends information into the computer, so it is an input.",
    "f.hw.q.cpu": "Which part follows instructions and does the calculations?",
    "f.hw.w.cpu": "The CPU is the brain of the computer.",
    "f.hw.q.mem": "Which part is the quick desk that forgets everything when the power goes off?",
    "f.hw.w.mem": "Memory (RAM) is fast, but it only holds things for a while.",
    "f.hw.q.sto": "Which part keeps the picture safe until tomorrow?",
    "f.hw.w.sto": "Storage keeps files even when the power is off.",
    "f.hw.q.out": "Which part shows you the letter A?",
    "f.hw.w.out": "The screen shows results to you, so it is an output.",
    "f.os.start": "Files live inside folders, and folders can live inside other folders, like boxes inside boxes. We call this a tree. The top folder is {root}. Let us find the file {file}.",
    "f.os.top": "Start at the top folder: {name}.",
    "f.os.open": "Open the folder {name}.",
    "f.os.found": "There it is: the file {name}!",
    "f.os.q1": "Which folder is the file {file} inside?",
    "f.os.w1": "We opened {folder} and the file {file} is inside it.",
    "f.os.q2": "What is the full path of {file}?",
    "f.os.w2": "A path lists the folders from the top, joined with /, and ends with the file name.",
    "f.os.end": "A path is the address of a file. Two files can have the same name if they are in different folders, because their paths are different.",
    "f.sh.c0": "A spreadsheet is a big table. Each box is a cell with a name: the column letter first, then the row number. The cell in column B, row 1 is called B1. Let us make the sheet do some maths.",
    "f.sh.c1": "Cell names work like addresses. A2 is column A, row 2.",
    "f.sh.qA2": "What number is in cell A2?",
    "f.sh.wA2": "A2 is column A, row 2, and it holds 5.",
    "f.sh.c2": "In C1 we type =A1+B1. A formula starts with an equals sign and uses cell names. The sheet adds 4 + 6 and shows {r}.",
    "f.sh.c3": "In C2 we type =A2*B2. The star * means times. So the sheet shows {r}.",
    "f.sh.q": "Cell {ref} holds {f}. What number does it show?",
    "f.sh.w1": "{a} + {b} = {r}.",
    "f.sh.w2": "{a} × {b} = {r}.",
    "f.sh.c4": "Formulas use cell names, not fixed numbers. That is why the sheet can keep the answers up to date for you.",
    "f.sh.s0": "Here is a column of numbers, A1 to A4. Adding them one by one is slow, so spreadsheets have functions. SUM adds a whole range of cells. A1:A4 means \"from A1 down to A4\".",
    "f.sh.s1": "In A5 we type =SUM(A1:A4). It adds 2 + 5 + 3 + 6 and shows {r}.",
    "f.sh.w3": "2 + 5 + 3 + 6 = {r}.",
    "f.sh.s2": "Now we change A2 from 5 to 9. Nobody touches A5, but the sheet recalculates it by itself: 2 + 9 + 3 + 6 = {r}. This is the magic of formulas.",
    "f.sh.qs2": "A2 is now 9. What does A5 show?",
    "f.sh.w4": "The sheet adds the new numbers: 2 + 9 + 3 + 6 = {r}.",
    "f.sh.s3": "MAX finds the biggest number in a range. In B5 we type =MAX(A1:A4) and it shows {r}.",
    "f.sh.w5": "The biggest of 2, 9, 3 and 6 is {r}.",
    "f.sh.s4": "Spreadsheets do the boring maths for us: sums, biggest numbers, averages. You only need to say which cells to use.",

    "f.db.f0": "A database stores facts in tables. Each row is one penguin (a record) and each column is one kind of fact (a field). This table has {n} penguins.",
    "f.db.f1": "A filter keeps only the rows that match a rule. The first rule is: {rule}.",

    "f.db.f3": "Another rule: {rule}. Filters work on any column.",

    "f.db.wn": "Count the highlighted rows for {rule}: there are {n}.",
    "f.db.fend": "Filtering and counting answer questions fast, even when a table has millions of rows. Computers never get tired of looking.",
    "f.db.s0": "Sorting puts the rows in order by one column. The table now is in the order the penguins joined.",
    "f.db.s1": "Sort by age, smallest first. The youngest penguin comes to the top.",
    "f.db.s2": "Now sort by fish eaten, biggest first. The hungriest penguin comes to the top.",
    "f.db.s3": "We can combine them: filter colony B, then sort by age. Only colony B is left, in order of age.",

    "f.db.send": "Filter, sort and count are the three tools behind almost every app that shows you a list, from a shop to a music player.",

    "d.sec.link": "Link",
    "d.sec.real": "The link really goes to:",
    "d.sec.prize.subj": "You won a free tablet!!!",
    "d.sec.prize.hurry": "Click the link in the next 10 minutes or the prize is gone.",
    "d.sec.prize.secret": "Then type your password to get it.",
    "d.sec.account.subj": "Your account will be closed",
    "d.sec.account.hurry": "We found a problem. You must act today.",
    "d.sec.account.secret": "Reply with your password or we delete your account.",
    "f.sec.p0": "A password is the key to your account. A strong one is hard to guess. Here are five checks: long (12 characters or more), a capital letter, a small letter, a number and a symbol. The passwords in this lesson are made up. Never use them, and never show your real password to anyone.",
    "f.sec.p1": "The password \"{pw}\" is short and is just one word. It passes only {n} of the five checks. Guessing programs try common words first.",
    "f.sec.qn": "How many of the five checks does \"{pw}\" pass?",
    "f.sec.wn": "It passes {n} of the five checks. Count the ticks.",
    "f.sec.p2": "\"{pw}\" is better: it has capital and small letters and numbers, so it passes {n} checks. But it has only 11 characters, no symbol, and a year is easy to guess.",
    "f.sec.qimp": "Which change makes this password stronger?",
    "o.sec.imp.a": "Make it longer and add a symbol",
    "o.sec.imp.b": "Write it on a note and stick it on the screen",
    "o.sec.imp.c": "Tell a friend so I do not forget it",
    "f.sec.wimp": "Longer and with more kinds of characters is harder to guess. A password on a note or told to a friend is no longer secret.",
    "f.sec.p3": "\"{pw}\" is long and mixes everything, so it passes all {n} checks. Tip: a little sentence with funny parts is easy for you to remember and hard for others to guess.",
    "f.sec.qstrong": "Which of these passwords is the strongest?",
    "f.sec.wstrong": "It is the longest and it passes all five checks.",
    "f.sec.p4": "Use a different password for every account, never share it, and let a grown-up help you keep your passwords safe.",
    "f.sec.m0": "Phishing is a trick message that tries to make you click a link or give away a secret, such as a password. The name sounds like fishing: the trickster throws out bait. Read this message slowly and look for clues.",
    "f.sec.m1": "Clue 1: the sender address looks odd. Real companies use their own name in the address, not a long strange one.",
    "f.sec.m2": "Clue 2: the message makes you hurry. Tricksters want you to act before you think.",
    "f.sec.qhurry": "Why does the message push you to hurry?",
    "o.sec.hurry.a": "Because the prize is small",
    "o.sec.hurry.b": "So you act before you think",
    "o.sec.hurry.c": "Because it is being polite",
    "f.sec.whurry": "Hurry is a trick: when you stop to think, you notice the other clues.",
    "f.sec.m3": "Clue 3: the message asks for your password. A real company never asks for your password in a message.",
    "f.sec.qpass": "A message asks you to type your password. What do you do?",
    "o.sec.pass.no": "Never. I do not give my password to a message",
    "o.sec.pass.yes1": "Yes, if the message looks nice",
    "o.sec.pass.yes2": "Yes, if it says it is urgent",
    "f.sec.wpass": "A password is a secret between you and your account. Nobody who is honest needs you to type it into a message.",
    "f.sec.m4": "Clue 4: the link text says one thing, but the link really goes somewhere else. Hold your finger or mouse over a link, without clicking, to see where it goes.",
    "f.sec.m5": "Four clues! The safe choice is simple: do not click, do not reply, and show it to a grown-up.",
    "f.sec.qdo": "What is the best thing to do with this message?",
    "o.sec.do.a": "Click quickly before the offer is gone",
    "o.sec.do.b": "Forward it to all my friends",
    "o.sec.do.c": "Do not click, show a grown-up and delete it",
    "f.sec.wdo": "Not clicking keeps you safe. A grown-up can check and report the message.",
    "d.cit.intro": "Think before you click, post or copy.",
    "d.cit.t.priv": "Privacy",
    "d.cit.t.kind": "Kindness",
    "d.cit.t.credit": "Giving credit",
    "d.cit.t.source": "Good sources",
    "f.cit.i1": "The internet is a big shared place, like a town square. Good penguin citizens look after themselves and after others. Let us practise with three situations.",
    "f.cit.e1": "Keep private things private, be kind, and tell a grown-up when something feels wrong.",
    "f.cit.i2": "Everything online was made by someone, and not everything online is true. Let us practise giving credit and checking sources.",
    "f.cit.e2": "Ask, give credit, write in your own words and check your sources. That is how you stay honest online.",
    "f.cit.q": "What is the best choice?",
    "d.cit.s.p1": "You are making a profile for a new online game. The game asks what to type in your profile.",
    "f.cit.p1": "Personal information is anything that tells who you are and where to find you: your full name, address, school, phone number, passwords and photos of your home. Keep it private online. A nickname is fine.",
    "f.cit.w.p1": "A nickname and a colour tell nothing about where you live. Address, school and phone number are personal information.",
    "o.cit.p1.a": "My home address and my school name",
    "o.cit.p1.b": "A nickname and my favourite colour",
    "o.cit.p1.c": "My phone number, so friends can call",
    "d.cit.s.k1": "A classmate posts a drawing online. You think the drawing is not very good.",
    "f.cit.k1": "Behind every screen there is a real person with real feelings. A good rule: only write what you would say to their face, and say it kindly.",
    "f.cit.w.k1": "Kind, honest words help people. Mean words hurt, even online, and they can stay there for a long time.",
    "o.cit.k1.a": "Write \"That is awful!\"",
    "o.cit.k1.b": "Say nothing and laugh about it with others",
    "o.cit.k1.c": "Write one thing you like and a kind idea to improve it",
    "d.cit.s.p2": "Someone you do not know writes to you in a game: \"Where do you live? Send me a photo!\"",
    "f.cit.p2": "Strangers online may not be who they say they are. Never tell them private things, never agree to meet them, and tell a grown-up you trust.",
    "f.cit.w.p2": "You cannot know who is really behind a name. Block, do not answer, and tell a grown-up.",
    "o.cit.p2.a": "Do not answer, block them and tell a grown-up",
    "o.cit.p2.b": "Send a photo, they seem nice",
    "o.cit.p2.c": "Tell them my street so they can visit",
    "d.cit.s.c1": "You find a nice picture online for your school project.",
    "f.cit.c1": "People who make pictures, songs and texts own them. This is called copyright. You cannot just take them and say they are yours. You may use a work if the owner allows it, and you should always say who made it.",
    "f.cit.w.c1": "Check the rules for the picture and credit the creator. Saying you made it yourself would be lying.",
    "o.cit.c1.a": "Use it and say nothing",
    "o.cit.c1.b": "Check that I may use it, and write who made it",
    "o.cit.c1.c": "Say that I drew it myself",
    "d.cit.s.l1": "A photo has the note: \"Free to use with credit to the photographer.\"",
    "f.cit.l1": "A licence is a note from the owner that says how others may use the work. For example: \"free to use if you give credit\". Look for it near the picture or text.",
    "f.cit.w.l1": "The licence tells you the rule: you can use the photo, but you must give credit.",
    "o.cit.l1.a": "I may use it without any name",
    "o.cit.l1.b": "I may not use it at all",
    "o.cit.l1.c": "I may use it, and I must write the photographer’s name",
    "d.cit.s.s1": "Two websites say different things about how long penguins live. Which do you trust more?",
    "f.cit.s1": "Anyone can put anything on the internet, so not everything is true. Trust sources that name the author, show the date and say where the facts come from. Check two or more sources.",
    "f.cit.w.s1": "Likes and a high place in the search do not prove something is true. A named author, a date and sources let you check.",
    "o.cit.s1.a": "The one that names its author, date and sources",
    "o.cit.s1.b": "The one with the most likes and a loud title",
    "o.cit.s1.c": "The one that came first in the search results",
    "d.cit.s.c2": "A friend says: \"Just copy the text from the website, nobody will notice.\"",
    "f.cit.c2": "Copying a whole text and handing it in as yours is called plagiarism. Instead, read it, understand it, then write in your own words and name where you got the information.",
    "f.cit.w.c2": "Writing in your own words shows you understood, and naming the source is honest.",
    "o.cit.c2.a": "Copy it, but change the title",
    "o.cit.c2.b": "Read it, write it in my own words and name the source",
    "o.cit.c2.c": "Copy it, but tell nobody",

    (f.active || []).forEach(function (e) { actK[key(e[0], e[1])] = 1; });
    (f.rejected || []).forEach(function (e) { rejK[key(e[0], e[1])] = 1; });
    if (f.path) for (var i = 1; i < f.path.length; i++) pathK[key(f.path[i - 1], f.path[i])] = 1;

    var out = '<svg class="gsvg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('d.mapLabel') + '">';
    G.edges.forEach(function (e) {
      var a = N[e[0]], b = N[e[1]], k = key(e[0], e[1]);
      var cls = 'ge' + (pathK[k] ? ' path' : treeK[k] ? ' tree' : rejK[k] ? ' rej' : '') + (actK[k] ? ' active' : '');
      out += '<line class="' + cls + '" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>';
      if (G.directed) {
        var dx = b[0] - a[0], dy = b[1] - a[1], ln = Math.sqrt(dx * dx + dy * dy) || 1, ux = dx / ln, uy = dy / ln;
        out += '<polygon class="ea' + cls.slice(2) + '" points="-11,-7 1,0 -11,7" transform="translate(' + (b[0] - ux * (R + 3)).toFixed(1) + ',' + (b[1] - uy * (R + 3)).toFixed(1) + ') rotate(' + (Math.atan2(uy, ux) * 180 / Math.PI).toFixed(1) + ')"/>';
      }
    });
    if (weighted) {
      G.edges.forEach(function (e) {
        var a = N[e[0]], b = N[e[1]], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        out += '<g class="wt"><rect x="' + (mx - 11) + '" y="' + (my - 10) + '" width="22" height="20" rx="7"/><text x="' + mx + '" y="' + (my + 5) + '">' + e[2] + '</text></g>';
      });
    }
    Object.keys(N).sort().forEach(function (id) {
      var p = N[id], x = p[0], y = p[1];
      var cls = 'gn' + (id === f.current ? ' cur' : inList[id] ? ' wait' : '') + (seen[id] || doneS[id] ? ' seen' : '') +
        (added[id] ? ' new' : '') + (f.update === id ? ' upd' : '');
      out += '<g class="' + cls + '"><circle cx="' + x + '" cy="' + y + '" r="' + R + '"/><text class="nl" x="' + x + '" y="' + (y + 6) + '">' + id + '</text></g>';
    });
    Object.keys(N).sort().forEach(function (id) {
      var p = N[id], x = p[0], y = p[1];
      if (o.goal === id) out += '<g class="fishg" transform="translate(' + (x + 6) + ',' + (y + 6) + ') scale(.6)">' + FISH_PARTS + '</g>';
      if (o.start === id) out += '<text class="lbl" x="' + x + '" y="' + (y + R + 14) + '">' + t('d.start') + '</text>';
      if (!weighted && seen[id]) {
        out += '<g class="ord"><circle cx="' + (x - R + 3) + '" cy="' + (y - R + 3) + '" r="8"/><text x="' + (x - R + 3) + '" y="' + (y - R + 6.5) + '">' + seen[id] + '</text></g>';
      }
      if (f.dist) {
        var dv = f.dist[id];
        out += '<text class="dl' + (f.update === id ? ' upd' : '') + '" x="' + (x + R + 1) + '" y="' + (y - R + 4) + '">' + (dv === null || dv === undefined ? '∞' : dv) + '</text>';
      }
      if (f.from && f.from[id]) {
        var q = N[f.from[id]], dx = q[0] - x, dy = q[1] - y, len = Math.sqrt(dx * dx + dy * dy) || 1;
        var ux = dx / len, uy = dy / len, ang = Math.atan2(uy, ux) * 180 / Math.PI;
        out += '<polygon class="fromarrow" points="-5,-6 6,0 -5,6" transform="translate(' + (x + ux * (R + 9)).toFixed(1) + ',' + (y + uy * (R + 9)).toFixed(1) + ') rotate(' + ang.toFixed(1) + ')"/>';
      }
      if (f.current === id) {
        out += '<g class="spr" transform="translate(' + (x - 16) + ',' + (y - R - 29) + ') scale(.8)">' + penguinParts(2, true) + '</g>';
      }
    });
    return out + '</svg>';
  }

  /** The waiting line (queue) or the pile (stack), shown as small penguins. */
  function chips(f, kind) {
    var isQ = kind === 'bfs', added = set(f.added);
    var body = (f.list || []).map(function (id) {
      return '<div class="pchip' + (id === f.taken ? ' out' : '') + (added[id] ? ' new' : '') + '">' + penguin(2, true) + '<span>' + id + '</span></div>';
    }).join('');
    return '<div class="panel"><h4>' + t(isQ ? 'd.queue' : 'd.stack') + '</h4>' +
      '<div class="line">' + (body || '<em class="empty">' + t('d.empty') + '</em>') + '</div>' +
      '<div class="ends"><span>' + t(isQ ? 'd.qFront' : 'd.sBottom') + '</span><span>' + t(isQ ? 'd.qBack' : 'd.sTop') + '</span></div></div>';
  }

  /** The paths to choose from (Prim) or the sorted list of all paths (Kruskal). */
  var STATE_WORD = { wait: '', take: ' ✓', skip: ' ✗', cur: ' ?' };
  function edgeList(f, kind) {
    var items = (f.elist || []).map(function (e) {
      return '<span class="ech ' + e.state + '"><b>' + e.a + '–' + e.b + '</b> ' + e.w + STATE_WORD[e.state] + '</span>';
    }).join('');
    var title = t(kind === 'prim' ? 'd.elPrim' : 'd.elKr');
    return '<div class="panel"><h4>' + title + '</h4><div class="elist">' + (items || '<em class="empty">' + t('d.none') + '</em>') + '</div>' +
      '<div class="legend"><span><i class="sw gold"></i>' + t('d.inTree') + '</span><span><i class="sw red"></i>' + t('d.skipped') + '</span></div></div>';
  }

  /** Costs so far for Dijkstra. */
  function distTable(G, f) {
    var rows = Object.keys(G.nodes).sort().map(function (id) {
      var dv = f.dist ? f.dist[id] : null, from = f.from && f.from[id];
      var cls = (id === f.current ? 'cur ' : '') + ((f.done || []).indexOf(id) >= 0 ? 'done ' : '') + (f.update === id ? 'upd' : '');
      return '<tr class="' + cls + '"><th scope="row">' + id + '</th><td>' + (dv === null || dv === undefined ? '∞' : dv) + '</td><td>' + (from || '–') + '</td></tr>';
    }).join('');
    return '<div class="panel"><h4>' + t('d.costTitle') + '</h4><table class="dtab"><thead><tr><th>' + t('d.place') + '</th><th>' + t('d.cost') + '</th><th>' + t('d.from') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ---------- Penguin rows ---------- */
  var TAGS = { mid: 'g.midTag', min: 'g.minTag' };
  function tagFor(f) { return t(TAGS[f.tag] || 'g.pivotTag'); }

  /** A still picture of the penguins in a line (used by the storyboard). */
  function sortRow(f, o) {
    var n = f.arr.length, w = (o && o.w) || Math.max(26, Math.min(44, Math.floor(250 / n)));
    var out = '<div class="srow" style="--pw:' + w + 'px">';
    f.arr.forEach(function (v, i) {
      var sorted = f.sorted.indexOf(i) >= 0, cls = 'sp';
      if (!sorted && (i < f.lo || i > f.hi)) cls += ' dim';
      if (sorted) cls += ' final';
      else if (i === f.cur || (f.pair && f.pair.indexOf(i) >= 0)) cls += ' cur';
      else if (i === f.pivot) cls += ' pivot';
      else if (f.left.indexOf(i) >= 0) cls += ' grp';
      var tag = sorted ? '✓' : (i === f.pivot ? tagFor(f) : '');
      out += '<div class="' + cls + '" data-tag="' + tag + '">' + penguin(v) + '</div>';
    });
    return out + '</div>';
  }

  /** The merge sort picture: rows of groups, cutting first and merging afterwards. */
  function mergeRows(f) {
    var widest = 0;
    f.rows.forEach(function (r) { widest = Math.max(widest, r.groups.reduce(function (s, g) { return s + g.len; }, 0)); });
    var mw = Math.max(16, Math.min(40, Math.floor((262 - (widest - 1) * 5) / widest) - 8));
    var out = '<div class="mtree" style="--mw:' + mw + 'px">';
    f.rows.forEach(function (r, ri) {
      if (ri === 0 || r.kind !== f.rows[ri - 1].kind) out += '<div class="mlabel">' + t(r.kind === 'split' ? 'd.cut' : 'd.merging') + '</div>';
      out += '<div class="mrow">';
      r.groups.forEach(function (g) {
        out += '<div class="mgrp ' + g.state + '">';
        if (g.values.length) g.values.forEach(function (v) { out += '<span class="mp">' + penguin(v) + '</span>'; });
        else for (var k = 0; k < g.len; k++) out += '<span class="mp ghost"></span>';
        out += '</div>';
      });
      out += '</div>';
    });
    return out + '</div>';
  }

  /** Topological sort: the line of places that are ready, and how many arrows each place still waits for. */
  function topoPanel(G, f) {
    var body = (f.list || []).map(function (id) {
      return '<div class="pchip' + (id === f.taken ? ' out' : '') + ((f.added || []).indexOf(id) >= 0 ? ' new' : '') + '">' + penguin(2, true) + '<span>' + id + '</span></div>';
    }).join('');
    var rows = Object.keys(G.nodes).sort().map(function (id) {
      var n = f.indeg ? f.indeg[id] : 0, isDone = (f.done || []).indexOf(id) >= 0;
      return '<tr class="' + (id === f.current ? 'cur ' : '') + (isDone ? 'done' : '') + '"><th scope="row">' + id + '</th><td>' + (isDone ? '✓' : n) + '</td></tr>';
    }).join('');
    return '<div class="panel"><h4>' + t('d.topoReady') + '</h4><div class="line">' + (body || '<em class="empty">' + t('d.empty') + '</em>') + '</div></div>' +
      '<div class="panel"><h4>' + t('d.topoWait') + '</h4><table class="dtab"><thead><tr><th>' + t('d.place') + '</th><th>' + t('d.topoCount') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /** Stack and queue side by side, doing the same jobs. */
  function dsPanels(f) {
    var qf = { list: f.queue, taken: f.outQ, added: f.newId ? [f.newId] : [] }, sf = { list: f.stack, taken: f.outS, added: f.newId ? [f.newId] : [] };
    return chips(qf, 'bfs') + chips(sf, 'dfs');
  }

  /** The heap as a family tree of numbers. */
  function heapSVG(f) {
    var a = f.arr, n = a.length, W = 330, levels = Math.max(1, Math.floor(Math.log(Math.max(n, 1)) / Math.LN2) + 1), H = 36 + (levels - 1) * 64 + 30, R = 18;
    function pos(i) {
      var lv = Math.floor(Math.log(i + 1) / Math.LN2), per = Math.pow(2, lv), k = i + 1 - per;
      return [Math.round((k + 0.5) / per * W), 32 + lv * 64];
    }
    var out = '<svg class="gsvg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('d.heapLabel') + '">', i;
    var pairK = {};
    if (f.pair) pairK[f.pair[0] + '|' + f.pair[1]] = true;
    for (i = 1; i < n; i++) {
      var par = (i - 1) >> 1, p1 = pos(par), p2 = pos(i);
      out += '<line class="ge' + (pairK[par + '|' + i] ? ' active' : '') + '" x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '"/>';
    }
    for (i = 0; i < n; i++) {
      var p = pos(i), cls = 'gn' + (i === f.cur ? ' cur' : '') + (f.pair && f.pair.indexOf(i) >= 0 && i !== f.cur ? ' new' : '') + ' seen';
      out += '<g class="' + cls + '"><circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + R + '"/><text class="nl" x="' + p[0] + '" y="' + (p[1] + 6) + '">' + a[i] + '</text></g>';
    }
    if (n) out += '<text class="lbl" x="' + pos(0)[0] + '" y="' + (pos(0)[1] - R - 6) + '">' + t('d.heapTop') + '</text>';
    return out + '</svg>';
  }

  /** Pictures for the beginner lessons: switches (binary), stepping stones (loops) and labelled boxes (variables). */
  var SCENES = {};
  function progScene(f) {
    var out = '', i;
    if (SCENES[f.kind]) return '<div class="prog">' + SCENES[f.kind](f) + '</div>';
    if (f.kind === 'bits') {
      out += '<div class="bitsrow">';
      f.places.forEach(function (pv, k) {
        out += '<div class="bitc ' + (f.bits[k] ? 'on' : 'off') + (k === f.cur ? ' cur' : '') + '"><span class="pv">' + pv + '</span><span class="bpg">' + penguin(f.bits[k] ? 4 : 1, true) + '</span><b>' + f.bits[k] + '</b></div>';
      });
      out += '</div><div class="bitsnote">' + t('d.bitsNote', { n: f.n, r: f.rem }) + '</div>';
    } else if (f.kind === 'loop') {
      out += '<div class="floes">';
      for (i = 1; i <= f.n; i++) out += '<div class="floe' + (i < f.i ? ' done' : i === f.i ? ' cur' : '') + '"><span>' + i + '</span>' + (i === f.i ? '<em class="hop">' + penguin(2, true) + '</em>' : '') + '</div>';
      out += '</div><div class="totbox"><span>' + t('d.total') + '</span><b>' + f.total + '</b></div>';
    } else if (f.kind === 'cond') {
      out += '<div class="vboxes"><div class="vbox changed"><i>temp</i><b>' + f.v + '</b></div></div><div class="flow">';
      var skip = f.rows.some(function (r) { return r.taken; });
      f.rows.forEach(function (r, k) {
        var cls = 'frow' + (r.cur ? ' cur' : '') + (r.taken ? ' taken' : '') + (skip && !r.taken ? ' dim' : '');
        var badge = r.res === true ? '<em class="yes">' + t('d.cond.yes') + '</em>' : r.res === false ? '<em class="no">' + t('d.cond.no') + '</em>' : '';
        out += '<div class="' + cls + '"><div class="cnd">' + (r.c === 'else' ? t('d.cond.else') : r.c + ' ?') + badge + '</div><span class="arr">&#8594;</span><div class="act">' + t('d.cond.' + r.act) + '</div></div>';
      });
      out += '</div>';
    } else if (f.kind === 'race') {
      var names = { walk: 'd.race.walk', wad: 'd.race.wad', slide: 'd.race.slide' }, CAP = 64;
      out += '<div class="race"><div class="racen">' + (f.n ? t('d.race.n', { n: f.n }) : t('d.race.pile')) + '</div>';
      f.rows.forEach(function (r) {
        var w = Math.min(100, Math.max(r.steps ? 4 : 0, r.steps / CAP * 100)), over = r.steps > CAP;
        out += '<div class="lane ' + r.id + '"><span class="who">' + t(names[r.id]) + '</span><div class="track"><i style="width:' + (r.hide ? 0 : w) + '%"></i>' + (over && !r.hide ? '<u>&#9654;</u>' : '') + '</div><b>' + (r.hide ? '?' : r.steps) + '</b></div>';
      });
      out += '</div>';
    } else if (f.kind === 'rep') {
      if (f.mode === 'word') {
        out += '<div class="rrow">' + f.word.split('').map(function (c, k) {
          var cd = f.codes[k], cur = k === f.idx, bits = cd ? cd.bin : '', num = cd ? (f.hide && cur ? '?' : cd.n) : '·';
          return '<div class="rcol' + (cur ? ' cur' : '') + '"><b class="rl">' + c + '</b><span class="rn">' + num + '</span><span class="rb">' + (cd && !(f.hide && cur) ? bits.split('').map(function (b) { return '<i class="' + (b === '1' ? 'on' : '') + '">' + b + '</i>'; }).join('') : '<i></i><i></i><i></i><i></i><i></i>') + '</span></div>';
        }).join('') + '</div><div class="bitsnote">' + t('d.rep.note') + '</div>';
      } else {
        out += '<div class="pixwrap"><div class="pix">' + f.rows.map(function (r, k) {
          return r.split('').map(function (c) { return '<u class="' + (c === '1' ? 'on' : '') + (k === f.idx ? ' cur' : '') + '"></u>'; }).join('');
        }).join('') + '</div><div class="pixn">' + f.rows.map(function (r, k) {
          var shown = k < f.done.length && !(f.hide && k === f.idx);
          return '<code class="' + (k === f.idx ? 'cur' : '') + '">' + (shown ? r : '?????') + '</code>';
        }).join('') + '</div></div>';
      }
    } else if (f.kind === 'net') {
      var col = function (title, inner) { return '<div class="ncol"><small>' + title + '</small>' + inner + '</div>'; };
      var chip = function (n, extra) { var p = f.pk[n - 1]; return '<div class="pkt' + (extra || '') + '"><i>#' + n + '</i><b>' + p.txt.replace(/ /g, '·') + '</b></div>'; };
      var sendIn = !f.split ? '<div class="pkt whole"><b>' + f.msg.replace(/ /g, '·') + '</b></div>' : f.pk.map(function (p, k) { return f.where[k] === 's' ? chip(p.n) : ''; }).join('');
      var netIn = f.pk.map(function (p, k) { return f.where[k] === 'x' ? chip(p.n, ' lost') + '<em class="lostx">&#10007;</em>' : ''; }).join('');
      var recvList = f.sorted ? f.recv.slice().sort(function (a, b) { return a - b; }) : f.recv;
      var recvIn = recvList.map(function (n) { return chip(n); }).join('');
      out += '<div class="net">' + col(t('d.net.sender'), sendIn) + col(t('d.net.network'), netIn || '<em class="hint">' + t('d.net.routers') + '</em>') + col(t('d.net.receiver'), recvIn) + '</div>';
      if (f.sorted) out += '<div class="bitsnote">' + f.recv.length + ' &#10003; ' + f.pk.map(function (p) { return p.txt; }).join('').replace(/ /g, '·') + '</div>';
    } else if (f.kind === 'ai') {
      var X = function (v) { return 24 + v * 28; }, Y = function (v) { return 232 - v * 22; };
      var svg = '<svg class="ai" viewBox="0 0 300 250" role="img"><rect x="24" y="12" width="266" height="220" rx="6" class="aibg"/>';
      (f.near || []).forEach(function (r) {
        var q = f.train.filter(function (z) { return z.id === r.id; })[0];
        svg += '<line class="ail' + (f.pick === r.id ? ' pick' : '') + '" x1="' + X(f.test.x) + '" y1="' + Y(f.test.y) + '" x2="' + X(q.x) + '" y2="' + Y(q.y) + '"/>';
      });
      f.train.forEach(function (q) {
        svg += (q.g === 'small' ? '<circle class="aip s" cx="' + X(q.x) + '" cy="' + Y(q.y) + '" r="9"/>' : '<rect class="aip b" x="' + (X(q.x) - 9) + '" y="' + (Y(q.y) - 9) + '" width="18" height="18" rx="3"/>') + '<text class="ail2" x="' + X(q.x) + '" y="' + (Y(q.y) + 4) + '">' + q.id + '</text>';
      });
      if (f.test) svg += '<g class="ain ' + (f.guess || '') + '"><path d="M' + X(f.test.x) + ' ' + (Y(f.test.y) - 12) + ' l11 12 l-11 12 l-11 -12 z"/><text x="' + X(f.test.x) + '" y="' + (Y(f.test.y) + 5) + '">?</text></g>';
      svg += '<text class="aiax" x="157" y="247">' + t('d.ai.weight') + '</text><text class="aiax" transform="rotate(-90 12 122)" x="12" y="122">' + t('d.ai.height') + '</text></svg>';
      out += svg + '<div class="legend"><span><i class="sw blue"></i>' + t('d.ai.small') + '</span><span><i class="sw gold"></i>' + t('d.ai.big') + '</span></div>';
    } else if (f.kind === 'data') {
      var mx = 10;
      out += '<div class="bars">' + f.vals.map(function (x, k) {
        return '<div class="bar' + (f.hi === k ? ' hi' : '') + (f.lo === k ? ' lo' : '') + (k < f.upto && f.total !== null ? ' cnt' : '') + '"><b>' + x + '</b><i style="height:' + (x / mx * 110) + 'px"></i><span>' + t('d.day.' + k) + '</span></div>';
      }).join('') + '</div>';
      if (f.total !== null) out += '<div class="totbox"><span>' + t('d.total') + '</span><b>' + f.total + '</b>' + (f.avg !== null ? '<span>' + t('d.data.avg') + '</span><b>' + f.avg + '</b>' : '') + '</div>';
    } else if (f.kind === 'cipher') {
      var al = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', row = function (a, b) {
        var h = '<div class="alpha">';
        for (var q = a; q < b; q++) h += '<span class="' + (al[q] === f.from && f.from ? 'from' : '') + (al[q] === f.to && f.to ? ' to' : '') + '">' + al[q] + '</span>';
        return h + '</div>';
      };
      out += '<div class="cipher">' + row(0, 13) + row(13, 26);
      out += '<div class="cwords"><div class="crow"><small>' + t('d.cip.plain') + '</small>' + f.word.split('').map(function (c, k) { return '<b class="' + (k === f.idx ? 'cur' : '') + '">' + c + '</b>'; }).join('') + '</div>';
      out += '<div class="crow"><small>' + t('d.cip.secret', { s: f.shift }) + '</small>' + f.word.split('').map(function (c, k) { return '<b class="sec ' + (k === f.idx ? 'cur' : '') + '">' + (f.out[k] || '·') + '</b>'; }).join('') + '</div></div></div>';
    } else {
      if (f.expect) out += '<div class="expect"><small>' + t('d.bug.want') + '</small> <code>' + f.expect + '</code></div>';
      out += '<div class="vcode">' + f.lines.map(function (ln, k) { return '<code class="' + (f.line.indexOf(k) >= 0 ? 'on' : '') + (f.badLine === k ? ' bad' : '') + '">' + ln + '</code>'; }).join('') + '</div>';
      out += '<div class="vboxes">' + (f.boxes.length ? f.boxes.map(function (b) {
        return '<div class="vbox' + (b.changed || f.highlight === b.name ? ' changed' : '') + '"><i>' + b.name + '</i><b>' + b.value + '</b></div>';
      }).join('') : '<em class="empty">' + t('d.noBoxes') + '</em>') + '</div>';
    }
    return '<div class="prog">' + out + '</div>';
  }

  /** The panel under a map: queue/stack chips, cost table or list of paths. */
  function side(kind, G, f) {
    if (kind === 'dij' || kind === 'bf') return distTable(G, f);
    if (kind === 'topo') return topoPanel(G, f);
    if (kind === 'prim' || kind === 'kruskal') return edgeList(f, kind);
    return chips(f, kind);
  }
  /** One whole still picture of a frame, for the storyboard and the quiz. */
  function scene(kind, G, f, o) {
    o = o || {};
    if (f.type === 'graph') return graphSVG(G, f, o) + (o.noSide ? '' : side(kind, G, f));
    if (f.type === 'sort') return sortRow(f);
    if (f.type === 'ds') return dsPanels(f);
    if (f.type === 'prog') return progScene(f);

/* Tiny optional sound effects made with the browser's own audio. Off by default (good for classrooms). */
(function () {
  'use strict';
  var KEY = 'pengurithm-sound', ctx = null;
  function isOn() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function setOn(v) { try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) {} }

    return ctx;

    var o = c.createOscillator(), g = c.createGain();

    g.gain.exponentialRampToValueAtTime(vol || 0.15, c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
  }
  var SOUNDS = {
    ok: [[660, 0, 0.14], [880, 0.12, 0.2]],
    no: [[220, 0, 0.22, 'triangle']],
    win: [[523, 0, 0.14], [659, 0.13, 0.14], [784, 0.26, 0.14], [1047, 0.39, 0.3]]
  };
  function play(name) {
    if (!isOn()) return;
    var c = audio(), s = SOUNDS[name];
    if (!c || !s) return;
    try {
      if (c.state === 'suspended') c.resume();
      s.forEach(function (n) { tone(c, n[0], n[1], n[2], n[3]); });
    } catch (e) {}
  }
  function toggle() { var v = !isOn(); setOn(v); if (v) play('ok'); return v; }
  window.Sound = { on: isOn, toggle: toggle, play: play };
})();

  START.os = function (level, ctx) {
    var root = G.TREES[level.tree], stack = [root], mistakes = 0, done = false;
    function cur() { return stack[stack.length - 1]; }
    function draw() {
      body('<div class="fqgoal"><small>' + tx('fq.find') + '</small><code>' + esc(level.file) + '</code></div><div class="ospath"><small>' + tx('fq.here') + '</small> <code>' + esc(stack.map(function (s) { return s.n; }).join('/')) + '</code></div><div class="fqlist">' +
        cur().c.map(function (c, i) { return '<button class="fqit ' + (c.c ? 'fo' : 'fi') + '" data-act="open" data-i="' + i + '"><i class="' + (c.c ? 'fo' : 'fi') + '"></i><span>' + esc(c.n) + '</span></button>'; }).join('') + '</div>' +
        (stack.length > 1 ? '<button class="btn small" data-act="up">' + tx('fq.up') + '</button>' : ''));
    }
    ctx.begin(level, '<div id="gm"></div>', '', function (a, t) {
      if (done) return;
      if (a === 'up') { stack.pop(); draw(); say(''); }
      else if (a === 'open') {
        var c = cur().c[+t.dataset.i];
        if (c.c) {
          stack.push(c); draw();
          if (G.holds(c, level.file)) say(tx('fq.ok', { f: level.file, d: c.n }), 'good');
          else { mistakes++; snd('no'); say(tx('fq.dead', { f: level.file, d: c.n }), 'bad'); }
        } else if (c.n === level.file) { done = true; ctx.finish(level, mistakes, tx('fq.won', { p: stack.map(function (s) { return s.n; }).concat(c.n).join('/') })); }
        else { mistakes++; flash(t); snd('no'); say(tx('fq.wrongFile', { f: level.file }), 'bad'); }
      }
    });
    draw(); say(tx('fq.goal', { f: level.file }));
  };

  /* ------------------------------------------------------ penguin detective */
  START.db = function (level, ctx) {
    var conds = [], mistakes = 0, done = false, i;
    for (i = 0; i < level.conds; i++) conds.push({ col: 'age', op: '>', val: 1 });
    function ruleText() { return conds.map(function (c) { return tx('d.db.' + c.col) + ' ' + c.op + ' ' + c.val; }).join(' ' + tx('dt.and') + ' '); }
    function draw() {
      var hit = G.pick(conds);
      body('<div class="dtgoal"><small>' + tx('dt.found') + '</small>' + level.target.map(function (n) { return '<span class="chip">' + esc(n) + '</span>'; }).join('') + '</div><div class="dtrules">' + conds.map(function (c, k) {
        return '<div class="dtrule">' + (k ? '<small>' + tx('dt.and') + '</small>' : '<small>' + tx('dt.rule') + '</small>') + '<button data-act="cyc" data-k="' + k + '" data-w="col">' + tx('d.db.' + c.col) + '</button><button data-act="cyc" data-k="' + k + '" data-w="op">' + c.op + '</button><button data-act="cyc" data-k="' + k + '" data-w="val">' + c.val + '</button></div>';
      }).join('') + '</div><table class="dbt"><tr>' + ['name', 'age', 'colony', 'fish'].map(function (c) { return '<th>' + tx('d.db.' + c) + '</th>'; }).join('') + '</tr>' +
        G.PENGUINS.map(function (r) { return '<tr class="' + (hit.indexOf(r[0]) >= 0 ? 'on' : 'off') + '">' + r.map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>');
    }
    function next(list, v) { return list[(list.indexOf(v) + 1) % list.length]; }
    ctx.begin(level, '<div id="gm"></div>', '<button class="btn primary" data-act="check">' + tx('dt.check') + '</button>', function (a, t) {
      if (done) return;
      if (a === 'cyc') {
        var c = conds[+t.dataset.k], w = t.dataset.w;
        if (w === 'col') { c.col = next(G.COLS, c.col); c.op = G.OPS[c.col][0]; c.val = G.VALUES[c.col][0]; }
        else if (w === 'op') c.op = next(G.OPS[c.col], c.op);
        else c.val = next(G.VALUES[c.col], c.val);
        draw(); say(tx('dt.tap'));
      } else if (a === 'check') {
        var got = G.pick(conds), want = level.target;
        if (got.length === want.length && want.every(function (n) { return got.indexOf(n) >= 0; })) { done = true; ctx.finish(level, mistakes, tx('dt.won', { rule: ruleText() })); }
        else { mistakes++; snd('no'); say(tx('dt.wrong', { got: got.length ? got.join(', ') : tx('dt.none'), want: want.join(', ') }), 'bad'); }
      }
    });
    draw(); say(tx('dt.goal'));
  };

  /* ------------------------------------------------------------ phish spotter */
  START.sec = function (level, ctx) {
    var found = [], mistakes = 0, done = false, m = 'd.sec.' + level.msg;
    function seg(id, text, cls) {
      var isFound = found.indexOf(id) >= 0;
      return '<span class="seg' + (isFound ? ' hot' : '') + (cls ? ' ' + cls : '') + '" data-act="seg" data-id="' + id + '" role="button" tabindex="0">' + esc(text) + (isFound ? '<em class="clue">✓</em>' : '') + '</span>';
    }
    function draw() {
      body('<div class="msgc"><div class="msgrow"><small>' + tx('d.sec.from') + '</small>' + seg('from', level.from, 'mono') + '</div><div class="msgrow"><small>' + tx('d.sec.subject') + '</small>' + seg('subj', tx(m + '.subj')) + '</div>' +
        '<div class="msgbody">' + seg('hurry', tx(m + '.hurry')) + ' ' + seg('secret', tx(m + '.secret')) + '</div>' +
        (level.link ? '<div class="msgrow link"><small>' + tx('d.sec.link') + '</small>' + seg('link', level.link, 'u') + '</div>' : '') +
        (found.indexOf('link') >= 0 ? '<div class="msgreal">' + tx('d.sec.real') + ' <code>' + esc(level.real) + '</code></div>' : '') + '</div>' +
        '<div class="rbinfo">' + tx('ps.found', { n: found.length, m: level.clues.length }) + '</div>');
    }
    ctx.begin(level, '<div id="gm"></div>', '<button class="btn" data-act="safe">' + tx('ps.safeBtn') + '</button>', function (a, t) {
      if (done) return;
      if (a === 'seg') {
        var id = t.dataset.id;
        if (found.indexOf(id) >= 0) return;
        if (level.clues.indexOf(id) >= 0) {
          found.push(id); draw(); snd('ok');
          if (found.length === level.clues.length) { done = true; ctx.finish(level, mistakes, tx('ps.won')); }
          else say(tx('ps.good', { why: tx('ps.why.' + id) }), 'good');
        } else { mistakes++; flash(t); snd('no'); say(tx('ps.notClue'), 'bad'); }
      } else if (a === 'safe') {
        if (!level.clues.length) { done = true; ctx.finish(level, mistakes, tx('ps.safeRight')); }
        else { mistakes++; snd('no'); say(tx('ps.safeWrong'), 'bad'); }
      }
    });
    draw(); say(tx('ps.goal'));
  };

  /* --------------------------------------------------------- formula factory */
  START.sheet = function (level, ctx) {
    var toks = [], mistakes = 0, done = false, COLS = 'ABCD', rows = 0, cols = 0;
    Object.keys(level.cells).forEach(function (r) { rows = Math.max(rows, +r.slice(1)); cols = Math.max(cols, COLS.indexOf(r[0]) + 1); });
    function show(t) { return t === '*' ? '×' : t; }
    function draw() {
      var res = G.evalTokens(toks, level.cells), g = '<table class="sht"><tr><th></th>';
      for (var c = 0; c < cols; c++) g += '<th>' + COLS[c] + '</th>';
      g += '</tr>';
      for (var r = 1; r <= rows; r++) { g += '<tr><th>' + r + '</th>'; for (c = 0; c < cols; c++) { var v = level.cells[COLS[c] + r]; g += '<td>' + (v === undefined ? '' : v) + '</td>'; } g += '</tr>'; }
      body('<div class="btgoal"><small>' + tx('fx.goalLabel') + '</small><b>' + level.target + '</b></div>' + g + '</table><div class="shbar"><b>=</b><code>' + (toks.length ? esc(toks.map(show).join(' ')) : '…') + '</code></div><div class="bitsnote">' + (res !== null ? tx('fx.shows') + ' ' + res : '') + '</div>' +
        '<div class="fxpal">' + level.tokens.map(function (t) { return '<button class="fxtok' + (t === '+' || t === '*' ? ' op' : '') + '" data-act="tok" data-t="' + esc(t) + '">' + esc(show(t)) + '</button>'; }).join('') + '</div>');
    }
    ctx.begin(level, '<div id="gm"></div>', '<button class="btn primary" data-act="check">' + tx('gm.check') + '</button><button class="btn" data-act="undo">' + tx('rb.undo') + '</button><button class="btn" data-act="clear">' + tx('rb.clear') + '</button>', function (a, t) {
      if (done) return;
      if (a === 'tok') { if (toks.length < 7) toks.push(t.dataset.t); draw(); say(''); }
      else if (a === 'undo') { toks.pop(); draw(); say(''); }
      else if (a === 'clear') { toks = []; draw(); say(''); }
      else if (a === 'check') {
        var r = G.evalTokens(toks, level.cells);
        if (r === null) { say(tx('fx.incomplete'), 'bad'); return; }
        if (r === level.target) { done = true; ctx.finish(level, mistakes, tx('fx.won', { f: '=' + toks.map(show).join(' '), n: r })); }
        else { mistakes++; snd('no'); say(tx('fx.wrong', { r: r, n: level.target }), 'bad'); }
      }
    });
    draw(); say(tx('fx.goal', { n: level.target }));
  };

  /* ------------------------------------------------------------- bubble dock */
  START.bs = function (level, ctx) {
    var arr = level.data.slice(), mistakes = 0, done = false;
    function draw() {
      body('<div class="bdrow">' + arr.map(function (v, i) { return '<button class="bdp" data-act="pen" data-i="' + i + '" aria-label="' + v + '">' + ctx.penguin(v) + '</button>'; }).join('') + '</div>');
    }
    ctx.begin(level, '<div id="gm"></div>', '', function (a, t) {
      if (done || a !== 'pen') return;
      var i = +t.dataset.i;
      if (i >= arr.length - 1) { say(tx('bd.last'), 'bad'); return; }
      if (arr[i] > arr[i + 1]) {
        var x = arr[i]; arr[i] = arr[i + 1]; arr[i + 1] = x; draw(); snd('ok'); say(tx('bd.swap'), 'good');
        if (G.isSorted(arr)) { done = true; ctx.finish(level, mistakes, tx('bd.won')); }
      } else { mistakes++; flash(t); snd('no'); say(tx('bd.no'), 'bad'); }
    });
    draw(); say(tx('bd.goal'));
  };

  window.MiniGames = { LEVELS: G.LEVELS, start: START };
})();

</script>

      else if (a === 'step') onNext();

  }
  function updateMist() { var m = $('#mist'); if (m) m.textContent = S.mode === 'play' ? tx('g.mistakes', { n: S.mistakes }) : tx('g.watchLearn'); }
  function say(text, cls) { var m = $('#msg'); m.className = 'msg ' + (cls || ''); m.innerHTML = text; }
  function onNext() { if (S.level.algo === 'qs') { if (S.k < S.trace.steps.length) { S.k++; showQS(); } } else { if (S.k < S.trace.steps.length) { S.k++; renderGraph(); } } }
  function toggleAuto(btn) {

  }
  function resultCard(stars, extra, hasNext) {

      '<div class="row"><button class="btn" data-act="replay">' + tx('g.replay') + '</button>' +
      (hasNext ? '<button class="btn primary" data-act="next">' + tx('g.next') + '</button>' : '') +
      '<button class="btn" data-act="menu">' + tx('g.menu') + '</button></div></div>';
  }
  function completeLevel() {
    var stars = A.starsFor(S.mistakes);

  }

  /* ---------- Graph levels (BFS / DFS) ---------- */
  function startGraph(level, mode) {
    var g = A.parseGrid(level.map);
    S = { level: level, mode: mode, g: g, trace: level.algo === 'bfs' ? A.bfsTrace(g) : A.dfsTrace(g), k: 0, mistakes: 0, finished: false };
    renderShell();
    skipTrivial();
    renderGraph();
  }
  function skipTrivial() {
    if (S.mode !== 'play') return;
    var st = S.trace.steps;
    while (S.k < st.length && st[S.k].frontier.length === 1) S.k++;
  }
  function renderGraph() {
    var g = S.g, tr = S.trace, done = S.k >= tr.steps.length, step = tr.steps[S.k];
    var visited = done ? tr.order : step.visitedBefore;
    var ord = {}; visited.forEach(function (id, i) { ord[id] = i + 1; });
    var frontier = done ? [] : step.frontier, fset = {}; frontier.forEach(function (id) { fset[id] = true; });
    var pathSet = {}; if (done && tr.path) tr.path.forEach(function (id) { pathSet[id] = true; });
    var html = '<div class="grid" style="grid-template-columns:repeat(' + g.w + ',1fr)">';
    for (var id = 0; id < g.w * g.h; id++) {
      if (g.walls[id]) { html += '<div class="tile wall"></div>'; continue; }
      var cls = 'tile', inner = '';
      if (pathSet[id]) cls += ' path'; else if (ord[id]) cls += ' visited';
      if (fset[id]) { cls += ' frontier'; inner = label(id); if (S.mode === 'watch' && id === step.answer) cls += ' next'; }
      else if (ord[id]) inner = ord[id];
      var em = '';
      if (id === g.goal) em = done && tr.found ? FISH_WIN_SVG : FISH_SVG;
      else if (id === g.start) em = penguin(2, true);
      html += '<div class="' + cls + '" data-act="tile" data-id="' + id + '">' + (em ? '<span class="em">' + em + '</span>' : inner) + '</div>';
    }
    $('#board').innerHTML = html + '</div>';

    var isQ = S.level.algo === 'bfs';
    if (!done) {
      $('#panel').innerHTML = '<div class="panel"><h4>' + tx(isQ ? 'g.queueTitle' : 'g.stackTitle') + '</h4><div class="chips">' +
        frontier.map(function (id) { return '<span class="chip">' + label(id) + '</span>'; }).join('') + '</div>' +
        '<div class="ends"><span>' + tx('g.addedFirst') + '</span><span>' + tx('g.addedLast') + '</span></div></div>';
    } else $('#panel').innerHTML = '';

    var ctr = $('#controls');
    if (done) {
      S.finished = true;
      var mine = tr.path ? tr.path.length - 1 : 0, best = A.bfsTrace(g).path.length - 1;
      var extra = isQ ? tx('g.bfsExtra', { n: mine }) : mine > best ? tx('g.dfsLong', { n: mine, b: best }) : tx('g.dfsSame', { n: mine });
      if (S.mode === 'play') {
        var stars = completeLevel(), i = LEVELS.indexOf(S.level);
        say(tx('g.gotFish'), 'good');
        ctr.innerHTML = resultCard(stars, extra, i < LEVELS.length - 1);
      } else {
        say(tx('g.fishFound', { extra: extra }));
        ctr.innerHTML = '<button class="btn primary" data-act="play">' + tx('g.nowYou') + '</button><button class="btn" data-act="mode" data-m="watch">' + tx('g.watchAgain') + '</button>';
      }
      updateMist();
      return;
    }
    if (S.mode === 'watch') {
      say(tx('g.watchMsg', { id: label(step.answer), verb: tx(isQ ? 'g.verbQ' : 'g.verbS'), tail: step.discovered.length ? tx(isQ ? 'g.tailQ' : 'g.tailS') : tx('g.tailNone') }));
      ctr.innerHTML = '<button class="btn primary" data-act="step">' + tx('g.next') + '</button><button class="btn" data-act="auto">' + tx('g.auto') + '</button>';
    } else {
      say(tx('g.askTile', { rule: chText(S.level.algo, 'rule') }));
      ctr.innerHTML = '';
    }
    updateMist();
  }
  function onTile(id) {
    if (!S || S.level.algo === 'qs' || S.mode !== 'play' || S.finished) return;
    var step = S.trace.steps[S.k]; if (!step || step.frontier.indexOf(id) < 0) return;
    if (id === step.answer) { S.k++; skipTrivial(); renderGraph(); return; }
    S.mistakes++; updateMist();
    var el = document.querySelector('.tile[data-id="' + id + '"]');
    if (el) { el.classList.add('wrong'); setTimeout(function () { el.classList.remove('wrong'); }, 400); }
    say(tx('g.notQuite', { hint: chText(S.level.algo, 'hint') }), 'bad');
  }


  /* ---------- Program the Penguin (robot levels) ---------- */
  function startRobot(level) {
    var R = window.Robot, L = R.parse(level), prog = [], times = 1, busy = false, ARR = { F: '▲', L: '↶', R: '↷' };
    S = { level: level, mode: 'robot', finished: false };
    function cell(x, y) { return 'ABCDE'.charAt(x) + (y + 1); }
    function scene(st, trail) { return window.Draw.SCENES.robot({ x: st.x, y: st.y, d: st.d, trail: trail, goal: L.goal, walls: L.walls }); }
    function chip(b, i, now) { return '<button class="rbchip' + (now ? ' now' : '') + '" data-act="rbrm" data-i="' + i + '" aria-label="' + tx('rb.remove') + '">' + (b.n > 1 ? b.n + '× ' : '') + ARR[b.c] + '</button>'; }

    function info() { var p = R.par(level); $('#rbinfo').textContent = tx('rb.blocks', { n: prog.length, par: p }); }

    var start = { x: L.start.x, y: L.start.y, d: L.start.d };
    $app.innerHTML =

      (level.maxRep > 1 ? '<div class="rbtimes"><span>' + tx('rb.times') + '</span>' + [1, 2, 3, 4].filter(function (n) { return n <= level.maxRep; }).map(function (n) { return '<button data-act="rbtimes" data-n="' + n + '" class="' + (n === 1 ? 'on' : '') + '">' + n + '</button>'; }).join('') + '</div>' : '') +
      '<div id="rbinfo" class="rbinfo"></div><div id="controls" class="controls"><button class="btn primary" data-act="rbrun">' + tx('rb.run') + '</button><button class="btn" data-act="rbundo">' + tx('rb.undo') + '</button><button class="btn" data-act="rbclear">' + tx('rb.clear') + '</button></div>';
    draw(start, [[start.x, start.y]]); tray(-1); info(); say(tx('rb.help' + (level.maxRep > 1 ? 'Loop' : '')));

      if (window.Sound) window.Sound.play('win');
      say(tx('rb.won', { n: prog.length }), 'good');
      $('#controls').innerHTML = '<div class="result"><h3>' + tx('g.complete') + '</h3><div class="bigstars">' + starStr(stars) + '</div><p>' + tx('rb.blocks', { n: prog.length, par: R.par(level) }) + '</p>' +
        '<div class="row"><button class="btn" data-act="replay">' + tx('g.replay') + '</button>' + (i < LEVELS.length - 1 && LEVELS[i + 1].algo === 'robot' ? '<button class="btn primary" data-act="next">' + tx('g.next') + '</button>' : '') + '<button class="btn" data-act="menu">' + tx('g.menu') + '</button></div></div>';

    $app.onclick = function (e) {
      var t = e.target.closest('[data-act]'); if (!t) return;

      else if (a === 'rbtimes') { times = +t.dataset.n; Array.prototype.forEach.call(document.querySelectorAll('.rbtimes button'), function (b) { b.classList.toggle('on', +b.dataset.n === times); }); }

  /* ---------- Light the Lamp (logic levels) ---------- */

    var C = window.Circuits, goal = C.solutions(level), found = [], setting = level.vars.map(function () { return '0'; }), mistakes = 0, done = false;

    function lampOn() { return C.lamp(level, code()) === 1; }
    function sw() { return level.vars.map(function (v, i) { return '<button class="cxsw ' + (setting[i] === '1' ? 'on' : 'off') + '" data-act="cxflip" data-i="' + i + '" aria-pressed="' + (setting[i] === '1') + '"><small>' + v + '</small><b>' + setting[i] + '</b></button>'; }).join(''); }
    function foundChips() { return found.length ? found.map(function (c) { return '<span class="chip">' + level.vars.map(function (v, i) { return v + '=' + c.charAt(i); }).join(' ') + '</span>'; }).join('') : '<em>' + tx('cx.none') + '</em>'; }
    function paint() {
      $('#cxsw').innerHTML = sw();
      var on = lampOn();
      $('#cxlamp').className = 'cxlamp ' + (on ? 'on' : 'off'); $('#cxlamp').innerHTML = '<span></span><small>' + tx(on ? 'd.lg.on' : 'd.lg.offw') + '</small>';

      '<div class="cxgoal">' + tx(level.target ? 'cx.goalOn' : 'cx.goalOff', { n: goal.length }) + '</div>' +
      '<div class="cxrow"><div id="cxsw" class="cxswrow"></div><div id="cxlamp"></div></div>' +
      '<div id="msg" class="msg"></div><div class="panel"><h4 id="cxcount"></h4><div id="cxfound" class="chips"></div></div>' +
      '<div class="rbinfo">' + tx('cx.legend') + '</div>' +

      $('#controls').innerHTML = '<div class="result"><h3>' + tx('g.complete') + '</h3><div class="bigstars">' + starStr(stars) + '</div><p>' + tx('g.mistakes', { n: mistakes }) + '</p>' +
        '<div class="row"><button class="btn" data-act="replay">' + tx('g.replay') + '</button>' + (i < LEVELS.length - 1 && LEVELS[i + 1].algo === 'logic' ? '<button class="btn primary" data-act="next">' + tx('g.next') + '</button>' : '') + '<button class="btn" data-act="menu">' + tx('g.menu') + '</button></div></div>';
    }
    $app.onclick = function (e) {
      var t = e.target.closest('[data-act]'); if (!t) return;
      var a = t.dataset.act;
      if (a === 'menu') showMenu();
      else if (a === 'info') window.Learn.open('logic');
      else if (a === 'replay') openLevel(level, null);
      else if (a === 'next') openLevel(LEVELS[LEVELS.indexOf(level) + 1], null);
      else if (done) return;
      else if (a === 'cxflip') { var i = +t.dataset.i; setting[i] = setting[i] === '1' ? '0' : '1'; paint(); say(''); }
      else if (a === 'cxsave') {
        var c = code();
        if (found.indexOf(c) >= 0) { say(tx('cx.dup'), 'bad'); return; }

        found.push(c); paint();

      }
    };
