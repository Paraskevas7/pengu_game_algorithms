  /* ---------- Quick sort levels ---------- */
  function startQS(level, mode) {
    S = { level: level, mode: mode, trace: A.quickSortTrace(level.data), k: 0, mistakes: 0, busy: false, finished: false, els: {} };
    renderShell();
    var board = $('#board'); board.className = 'board qs';
    level.data.forEach(function (v) {
      var d = document.createElement('div'); d.className = 'pgn'; d.innerHTML = penguin(v); board.appendChild(d); S.els[v] = d;
    });
    showQS();
  }
  function layoutQS(view) {
    var data = S.level.data, board = $('#board'), n = data.length, W = board.clientWidth || 320, slot = W / n;
    var pw = Math.min(slot - 6, 70), mx = Math.max.apply(null, data);
    board.style.height = Math.round(pw * (22 + mx * 6) / 40 + 36) + 'px';
    view.arr.forEach(function (v, i) {
      var el = S.els[v];
      el.style.width = pw + 'px';
      el.style.transform = 'translateX(' + (i * slot + (slot - pw) / 2) + 'px)';
      var inRange = i >= view.lo && i <= view.hi, cls = 'pgn';
      if (!inRange && view.sorted.indexOf(i) < 0) cls += ' dim';
      if (view.sorted.indexOf(i) >= 0) cls += ' final';
      else if (i === view.j) cls += ' cur';
      else if (i === view.pivot) cls += ' pivot';
      el.className = cls;
      el.dataset.tag = view.sorted.indexOf(i) >= 0 ? '✓' : i === view.pivot ? tx('g.pivotTag') : '';
    });
  }
  function showQS() {
    stopQsDelay();
    var tr = S.trace, ctr = $('#controls');
    if (S.k >= tr.steps.length) return finishQS();
    var s = tr.steps[S.k], n = S.level.data.length;
    if (s.type === 'compare') {
      layoutQS({ arr: s.before, sorted: s.sorted, lo: s.lo, hi: s.hi, j: s.j, pivot: s.hi });
      if (S.mode === 'watch') {
        say(tx('g.qsWatch', { p: s.pivot, v: s.value, res: tx(s.smaller ? 'g.qsShort' : 'g.qsTall') }));
        ctr.innerHTML = '<button class="btn primary" data-act="step">' + tx('g.next') + '</button><button class="btn" data-act="auto">' + tx('g.auto') + '</button>';
      } else {
        say(tx('g.qsAsk', { p: s.pivot, v: s.value }));
        ctr.innerHTML = '<button class="btn" data-act="side" data-side="left">' + tx('g.btnLeft') + '</button><button class="btn" data-act="side" data-side="right">' + tx('g.btnRight') + '</button>';
      }
    } else {
      layoutQS({ arr: s.arr, sorted: s.sorted, lo: s.lo, hi: s.hi, j: -1, pivot: -1 });
      var text = s.type === 'place'
        ? tx('g.qsPlace', { p: s.pivot })
        : tx('g.qsLone');
      say(text);
      if (S.mode === 'watch') ctr.innerHTML = '<button class="btn primary" data-act="step">' + tx('g.next') + '</button><button class="btn" data-act="auto">' + tx('g.auto') + '</button>';
      else { ctr.innerHTML = ''; S.busy = true; timer = setTimeout(function () { S.busy = false; S.k++; showQS(); }, 1100); }
    }

  }
  function stopQsDelay() { if (timer && S.mode === 'play') { clearTimeout(timer); timer = null; } }
  function answerQS(side) {
    if (S.busy || S.mode !== 'play') return;
    var s = S.trace.steps[S.k]; if (!s || s.type !== 'compare') return;
    if ((side === 'left') === s.smaller) {
      S.busy = true;
      layoutQS({ arr: s.arr, sorted: s.sorted, lo: s.lo, hi: s.hi, j: -1, pivot: s.hi });
      say(tx(s.smaller ? 'g.qsOkS' : 'g.qsOkT', { v: s.value, p: s.pivot }), 'good');
      timer = setTimeout(function () { timer = null; S.busy = false; S.k++; showQS(); }, 650);
    } else {
      S.mistakes++; updateMist();
      var el = S.els[s.value]; el.classList.add('wrong'); setTimeout(function () { el.classList.remove('wrong'); }, 400);
      say(tx('g.qsWrong', { v: s.value, p: s.pivot }), 'bad');
    }
  }
  function finishQS() {
    var n = S.level.data.length, all = []; for (var i = 0; i < n; i++) all.push(i);
    layoutQS({ arr: S.trace.result, sorted: all, lo: 0, hi: n - 1, j: -1, pivot: -1 });
    S.finished = true;
    var ctr = $('#controls');
    if (S.mode === 'play') {
      var stars = completeLevel(), i2 = LEVELS.indexOf(S.level);
      say(tx('g.qsAll'), 'good');
      ctr.innerHTML = resultCard(stars, tx('g.qsResult'), i2 < LEVELS.length - 1);
    } else {
      say(tx('g.qsDone'));
      ctr.innerHTML = '<button class="btn primary" data-act="play">' + tx('g.nowYou') + '</button><button class="btn" data-act="mode" data-m="watch">' + tx('g.watchAgain') + '</button>';
    }
    updateMist();
  }

  window.PenguinCore = { penguin: penguin, LEVELS: LEVELS, CHAPTERS: CHAPTERS, showMenu: showMenu, showHome: showHome, doneChapters: doneChapters, openLevel: openLevel, FISH_SVG: FISH_SVG, FISH_WIN_SVG: FISH_WIN_SVG };
  showHome();
})();

<script>
/* Lesson pages: goal, animated player, "story in pictures" storyboard, theory, facts and pseudocode. */
(function () {
  'use strict';

  var tx = window.I18n.t;

  var SPEEDS = [1900, 1300, 900, 550, 320];
  var TYPE = { bfs: 'graph', dfs: 'graph', dij: 'graph', topo: 'graph', bf: 'graph', prim: 'graph', kruskal: 'graph', qs: 'sort', bs: 'sort', bin: 'sort', sel: 'sort', ins: 'sort', sq: 'ds', bits: 'prog', loop: 'prog', vars: 'prog', cond: 'prog', bug: 'prog', race: 'prog', cipher: 'prog', robot: 'prog', algo: 'prog', logic: 'prog', types: 'prog', arr: 'prog', func: 'prog', rec: 'prog', hw: 'prog', os: 'prog', sheet: 'prog', db: 'prog', sec: 'prog', cit: 'prog', rep: 'prog', net: 'prog', ai: 'prog', data: 'prog', heap: 'heap', ms: 'merge' };
  var BIN_ARR = [1, 2, 3, 5, 6, 8, 9];

  var MIXED = { qs: [4, 7, 2, 6, 1, 5, 3], bs: [4, 7, 2, 6, 1, 5, 3], bin: BIN_ARR, sel: [4, 7, 2, 6, 1, 5, 3], ins: [4, 7, 2, 6, 1, 5, 3], heap: [5, 3, 7, 1, 6, 2, 4], ms: [5, 2, 7, 1, 8, 3, 6, 4] };
  var SIZE = { qs: 7, bs: 7, sel: 7, ins: 7, heap: 7, ms: 8 };
  var MINN = { qs: 3, bs: 2, sel: 2, ins: 2, heap: 3, ms: 2 };
  var MAXN = { heap: 7 };
  var L = null, keyHandler = null;

  var ICON = {
    first: '<svg viewBox="0 0 24 24" width="22" height="22"><rect x="5" y="5" width="3" height="14" fill="currentColor"/><polygon points="19,5 9,12 19,19" fill="currentColor"/></svg>',
    back: '<svg viewBox="0 0 24 24" width="22" height="22"><polygon points="17,5 7,12 17,19" fill="currentColor"/></svg>',
    next: '<svg viewBox="0 0 24 24" width="22" height="22"><polygon points="7,5 17,12 7,19" fill="currentColor"/></svg>',
    play: '<svg viewBox="0 0 24 24" width="26" height="26"><polygon points="7,4 20,12 7,20" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" width="26" height="26"><rect x="6" y="5" width="4.5" height="14" fill="currentColor"/><rect x="13.5" y="5" width="4.5" height="14" fill="currentColor"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" width="30" height="30"><path d="M9 3h6v9h4l-7 9-7-9h4z" fill="currentColor"/></svg>'

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function $(sel) { return $app.querySelector(sel); }

  /* ---------- Lifecycle ---------- */
  function leave() {
    if (L && L.timer) clearInterval(L.timer);

    $app.classList.remove('wide');
    $app.oninput = null;
  }

  function open(kind) {
    leave();
    L = { kind: kind, type: TYPE[kind], i: 0, speed: 3, playing: false, timer: null, ex: 0, preset: 'mixed', els: {} };
    if (L.type !== 'graph' && L.type !== 'ds' && L.type !== 'prog') L.arr = MIXED[kind].slice();
    compute();
    render();
    window.scrollTo(0, 0);
    keyHandler = function (e) {
      if (!L) return;
      var tag = e.target && e.target.tagName;
      if (tag === 'INPUT' && e.target.id === 'nums' && e.key === 'Enter') { applyNumbers(); e.preventDefault(); return; }
      if (tag === 'INPUT') return;
      if (e.key === 'ArrowRight') { pause(); go(L.i + 1); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { pause(); go(L.i - 1); e.preventDefault(); }
      else if (e.key === ' ' && tag !== 'BUTTON') { toggle(); e.preventDefault(); }
    };
    document.addEventListener('keydown', keyHandler);
  }

  function compute() {
    if (L.type === 'graph') {
      L.graph = G.graphFor(L.kind);
      var ex = L.graph.examples[L.ex];
      L.data = G.graphFrames(L.kind, L.graph, ex.start, ex.goal);
    } else if (L.type === 'sort') L.data = L.kind === 'bs' ? F.bubbleFrames(L.arr) : L.kind === 'sel' ? F.selectionFrames(L.arr) : L.kind === 'ins' ? F.insertionFrames(L.arr) : L.kind === 'bin' ? F.binaryFrames(L.arr, BIN_EX[L.ex].v) : F.sortFrames(L.arr);
    else if (L.type === 'ds') L.data = F.dsFrames();
    else if (L.type === 'prog') L.data = F.progFrames(L.kind, L.ex);
    else if (L.type === 'heap') L.data = F.heapFrames(L.arr);
    else L.data = F.mergeFrames(L.arr);
    L.i = 0;
    L.story = pickStory();
  }

  /** Up to six key moments, spread evenly through the lesson. */
  function pickStory() {
    var fr = L.data.frames, idx = [];
    fr.forEach(function (f, k) { if (f.ms) idx.push(k); });
    if (idx[0] !== 0) idx.unshift(0);
    if (idx[idx.length - 1] !== fr.length - 1) idx.push(fr.length - 1);
    if (idx.length > 6) {
      var pick = [];
      for (var k = 0; k < 6; k++) pick.push(idx[Math.round(k * (idx.length - 1) / 5)]);
      idx = pick.filter(function (v, k2) { return pick.indexOf(v) === k2; });
    }
    return idx;
  }

  /* ---------- Page ---------- */
  function exampleHTML() {
    var U = T.ui;
    if (L.type === 'graph') {
      if (L.graph.examples.length < 2) return '';
      return '<div class="seg" role="group" aria-label="' + esc(tx('l.examples')) + '">' + L.graph.examples.map(function (ex, k) {
        return '<button data-act="ex" data-i="' + k + '" class="' + (L.ex === k ? 'on' : '') + '">' + esc(tx(ex.key, ex.vars)) + '</button>';
      }).join('') + '</div>';
    }
    if (L.kind === 'bin') {
      return '<div class="seg" role="group" aria-label="' + esc(tx('l.examples')) + '">' + BIN_EX.map(function (ex, k) {
        return '<button data-act="ex" data-i="' + k + '" class="' + (L.ex === k ? 'on' : '') + '">' + esc(tx(ex.key, { v: ex.v })) + '</button>';
      }).join('') + '</div>';
    }
    if (L.type === 'ds') return '';
    if (L.type === 'prog') {
      return '<div class="seg" role="group" aria-label="' + esc(tx('l.examples')) + '">' + F.PROG_EX[L.kind].map(function (ex, k) {
        return '<button data-act="ex" data-i="' + k + '" class="' + (L.ex === k ? 'on' : '') + '">' + esc(tx(ex.key, ex.vars)) + '</button>';
      }).join('') + '</div>';
    }
    var presets = [['mixed', tx('l.mixed')], ['random', tx('l.random')], ['sorted', tx('l.sorted')], ['reversed', tx('l.reversed')]];
    return '<div class="seg" role="group" aria-label="' + esc(tx('l.examples')) + '">' + presets.map(function (p) {
      return '<button data-act="preset" data-p="' + p[0] + '" class="' + (L.preset === p[0] ? 'on' : '') + '">' + p[1] + '</button>';
    }).join('') + '</div>' +
      '<label class="numlabel" for="nums">' + esc(U.numbersLabel) + '</label>' +
      '<div class="numrow"><input id="nums" type="text" inputmode="numeric" autocomplete="off" value="' + L.arr.join(' ') + '">' +
      '<button class="btn small" data-act="apply">' + esc(U.numbersButton) + '</button></div><p class="numerr" id="numerr" role="alert"></p>';
  }

  function render() {
    var X = T[L.kind], U = T.ui, hasPractice = true;
    $app.classList.add('wide');
    $app.innerHTML =
      '<div class="topbar"><button class="icon-btn" data-act="back" aria-label="' + esc(tx('l.back')) + '">‹</button>' +
      '<div class="ttl"><b>' + esc(X.title) + '</b><small>' + esc(X.tag) + '</small></div>' +
      (hasPractice ? '<button class="ghost primary" data-act="practice">' + esc(tx('l.practice')) + '</button>' : '<span class="topspace"></span>') + '</div>' +
      '<div class="lesson">' +
      '<section class="intro"><div class="pip">' + D.penguin(4, true) + '</div><div class="bubble"><h3>' + esc(tx('l.goal')) + '</h3><p class="t-pink">' + esc(X.goal) + '</p></div></section>' +
      '<section class="player card"><div id="stage" class="stage"></div><div id="side"></div>' +
      '<div class="caption"><div class="pipsay">' + D.penguin(2, true) + '</div><div class="said" id="said" aria-live="polite"></div></div>' +
      '<input id="scrub" class="scrub" type="range" min="0" max="' + (L.data.frames.length - 1) + '" value="0" aria-label="' + esc(tx('l.stepAria')) + '">' +
      '<div class="transport">' +
      '<button class="tbtn" data-act="first" aria-label="' + esc(tx('l.first')) + '" title="' + esc(tx('l.first')) + '">' + ICON.first + '</button>' +
      '<button class="tbtn" data-act="prev" aria-label="' + esc(tx('l.prev')) + '" title="' + esc(tx('l.prev')) + '">' + ICON.back + '</button>' +
      '<button class="tbtn play" data-act="toggle" id="playbtn" aria-label="' + esc(tx('l.play')) + '" title="' + esc(tx('l.play')) + '">' + ICON.play + '</button>' +
      '<button class="tbtn" data-act="step" aria-label="' + esc(tx('l.next')) + '" title="' + esc(tx('l.next')) + '">' + ICON.next + '</button>' +
      '<label class="speed">' + esc(tx('l.speed')) + '<input id="speed" type="range" min="1" max="5" value="' + L.speed + '"></label></div>' +
      (exampleHTML() ? '<div class="examples"><h4>' + esc(U.examples) + '</h4>' + exampleHTML() + '</div>' : '') + '</section>' +
      '<section class="storyboard"><h2>' + esc(U.storyTitle) + '</h2><p class="hint">' + esc(U.storyHint) + '</p><div id="story"></div></section>' +
      '<section class="theory">' +
      '<h2>' + esc(U.howTitle) + '</h2>' + X.story.map(function (p) { return '<p class="t-white">' + esc(p) + '</p>'; }).join('') +
      '<ol class="steps t-white">' + X.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      '<div class="gold-box"><h3>' + esc(U.rememberTitle) + '</h3><p>' + esc(X.remember) + '</p></div>' +
      '<div class="gold-box time"><h3>' + esc(U.timeTitle) + '</h3><div class="formula">' + esc(X.time.formula) + '</div><p class="t-white">' + esc(X.time.text) + '</p></div>' +
      '<div class="two"><div class="note"><h3>' + esc(U.usedTitle) + '</h3><p class="t-white">' + esc(X.used) + '</p></div>' +
      '<div class="note warn"><h3>' + esc(U.watchTitle) + '</h3><p class="t-pink">' + esc(X.watch) + '</p></div></div>' +
      '<details class="codebox"><summary>' + esc(U.codeTitle) + '</summary><p class="hint">' + esc(U.codeHint) + '</p><ol class="code" id="code">' +
      L.data.pseudo.map(function (line) { return '<li>' + esc(line) + '</li>'; }).join('') + '</ol></details>' +
      '</section></div>';

    $app.onclick = onClick;
    $app.oninput = function (e) {
      if (!L) return;
      if (e.target.id === 'scrub') { pause(); go(+e.target.value, true); }
      if (e.target.id === 'speed') { L.speed = +e.target.value; if (L.playing) { clearInterval(L.timer); startTimer(); } }
    };
    if (L.type === 'sort') buildSortStage();
    buildStory();
    draw();
    stabilize();
  }

  function buildStory() {
    var fr = L.data.frames, n = fr.length, html = '';
    L.story.forEach(function (idx, k) {
      var f = fr[idx], pic;
      if (L.type === 'graph') {
        pic = D.graphSVG(L.graph, f, { goal: L.data.goal, start: L.data.start }) + (L.kind === 'dij' || L.kind === 'bf' ? '' : D.side(L.kind, L.graph, f));
      } else if (L.type === 'sort') pic = D.sortRow(f);
      else if (L.type === 'ds') pic = D.dsPanels(f);
      else if (L.type === 'prog') pic = D.progScene(f);
      else if (L.type === 'heap') pic = D.heapSVG(f);
      else pic = D.mergeRows(f);
      if (k) html += '<div class="arrow" aria-hidden="true">' + ICON.arrow + '</div>';
      html += '<figure class="spanel"><div class="snum">' + esc(tx('l.step', { i: idx + 1, n: n })) + '</div><div class="spic">' + pic + '</div><figcaption>' + esc(f.text) + '</figcaption></figure>';
    });
    $('#story').innerHTML = html;
  }

  /* ---------- Events ---------- */
  function onClick(e) {
    var t = e.target.closest('[data-act]'); if (!t || !L) return;
    var a = t.dataset.act;
    if (a === 'back') C.showMenu();
    else if (a === 'practice') {
      var first = C.LEVELS.filter(function (l) { return l.algo === L.kind; })[0];
      if (first) C.openLevel(first, null); else window.Quiz.open(L.kind, 0);
    }
    else if (a === 'first') { pause(); go(0); }
    else if (a === 'prev') { pause(); go(L.i - 1); }
    else if (a === 'step') { pause(); go(L.i + 1); }
    else if (a === 'toggle') toggle();
    else if (a === 'ex') { L.ex = +t.dataset.i; reload(); }
    else if (a === 'preset') {
      L.preset = t.dataset.p;
      L.arr = L.preset === 'mixed' ? MIXED[L.kind].slice() : F.makeArray(L.preset, SIZE[L.kind]);
      reload();
    }
    else if (a === 'apply') applyNumbers();
  }

  function applyNumbers() {
    var box = $('#nums'), res = F.parseNumbers(box ? box.value : '', MINN[L.kind], MAXN[L.kind] || 8);
    if (!res.ok) { $('#numerr').textContent = res.error; return; }
    L.arr = res.arr; L.preset = 'custom';
    reload();
  }

  function reload() {
    pause();
    var y = window.scrollY;
    compute(); render();
    window.scrollTo(0, y);
  }

  /* ---------- Player ---------- */
  function go(i, fromScrub) {
    if (!L) return;
    L.i = Math.max(0, Math.min(L.data.frames.length - 1, i));
    draw(fromScrub);
  }
  function startTimer() {
    L.timer = setInterval(function () {
      if (!L) return;
      if (!document.getElementById('stage')) { pause(); return; }
      if (L.i >= L.data.frames.length - 1) { pause(); return; }
      go(L.i + 1);
    }, SPEEDS[L.speed - 1]);
  }
  function play() {
    if (L.i >= L.data.frames.length - 1) go(0);
    L.playing = true; startTimer(); updatePlayBtn();
  }
  function pause() {
    if (!L) return;
    if (L.timer) { clearInterval(L.timer); L.timer = null; }
    L.playing = false; updatePlayBtn();
  }
  function toggle() { if (!L) return; if (L.playing) pause(); else play(); }
  function updatePlayBtn() {
    var b = $('#playbtn'); if (!b) return;
    b.innerHTML = L.playing ? ICON.pause : ICON.play;
    var lab = tx(L.playing ? 'l.pause' : 'l.play');
    b.setAttribute('aria-label', lab);
    b.title = lab;
  }

  /* Keep the controls still: measure every frame once and give the picture, side panel and speech box the tallest height. */
  function stabilize() {
    if (!L || !document.getElementById('stage')) return;
    var st = $('#stage'), sd = $('#side'), sa = $('#said'), keep = L.i, mh = 0, mside = 0, msaid = 0, i;
    [st, sd, sa].forEach(function (e) { e.style.minHeight = ''; });
    for (i = 0; i < L.data.frames.length; i++) {
      L.i = i; draw(true);
      if (L.type !== 'sort') mh = Math.max(mh, Math.ceil(st.getBoundingClientRect().height));
      mside = Math.max(mside, Math.ceil(sd.getBoundingClientRect().height)); msaid = Math.max(msaid, Math.ceil(sa.getBoundingClientRect().height));
    }
    L.i = keep; draw(false);
    if (mh) st.style.minHeight = mh + 'px';
    if (mside) sd.style.minHeight = mside + 'px';
    sa.style.minHeight = msaid + 'px';
    if (!resizeBound) { resizeBound = true; window.addEventListener('resize', function () { if (L) stabilize(); }); }
  }
  var resizeBound = false;

  /* ---------- Drawing the current frame ---------- */
  function draw(fromScrub) {
    var frames = L.data.frames, f = frames[L.i], n = frames.length;
    $('#said').innerHTML = '<span class="stepno">' + esc(tx('l.step', { i: L.i + 1, n: n })) + '</span>' + esc(f.text);
    if (!fromScrub) $('#scrub').value = L.i;
    var lis = $app.querySelectorAll('#code li');
    for (var k = 0; k < lis.length; k++) lis[k].classList.toggle('on', f.line.indexOf(k) >= 0);
    $app.querySelector('[data-act="first"]').disabled = L.i === 0;
    $app.querySelector('[data-act="prev"]').disabled = L.i === 0;
    $app.querySelector('[data-act="step"]').disabled = L.i === n - 1;
    if (L.type === 'graph') {
      $('#stage').innerHTML = D.graphSVG(L.graph, f, { goal: L.data.goal, start: L.data.start });
      $('#side').innerHTML = D.side(L.kind, L.graph, f);
    } else if (L.type === 'prog') {
      $('#stage').className = 'stage'; $('#stage').innerHTML = D.progScene(f);
      $('#side').innerHTML = '';
    } else if (L.type === 'ds') {
      $('#stage').className = 'stage'; $('#stage').innerHTML = D.dsPanels(f);
      $('#side').innerHTML = '';
    } else if (L.type === 'heap') {
      $('#stage').className = 'stage'; $('#stage').innerHTML = D.heapSVG(f);
      $('#side').innerHTML = '<div class="legend"><span><i class="sw gold"></i>' + esc(tx('l.legendHeapMove')) + '</span><span><i class="sw blue"></i>' + esc(tx('l.legendHeapOther')) + '</span></div>';
    } else if (L.type === 'merge') {
      $('#stage').innerHTML = D.mergeRows(f);
      $('#side').innerHTML = '';
    } else drawSort(f);
  }

  function buildSortStage() {
    var board = $('#stage'); board.className = 'stage board qs'; board.innerHTML = '';
    L.els = {};
    L.arr.forEach(function (v) {
      var d = document.createElement('div'); d.className = 'pgn'; d.innerHTML = D.penguin(v); board.appendChild(d); L.els[v] = d;
    });
    $('#side').innerHTML = L.kind === 'bin'
      ? '<div class="legend"><span><b>' + esc(tx('l.looking', { v: BIN_EX[L.ex].v })) + '</b></span><span><i class="sw gold"></i>' + esc(tx('l.legendMid')) + '</span><span><i class="sw green"></i>' + esc(tx('l.legendFound')) + '</span></div>'
      : L.kind === 'sel'
      ? '<div class="legend"><span><i class="sw gold"></i>' + esc(tx('l.legendSel')) + '</span><span><i class="sw blue"></i>' + esc(tx('l.legendChecked')) + '</span><span><i class="sw green"></i>' + esc(tx('l.legendFinal')) + '</span></div>'
      : L.kind === 'ins'
      ? '<div class="legend"><span><i class="sw blue"></i>' + esc(tx('l.legendMove')) + '</span><span><i class="sw green"></i>' + esc(tx('l.legendSortedPart')) + '</span></div>'
      : L.kind === 'bs'
      ? '<div class="legend"><span><i class="sw blue"></i>' + esc(tx('l.legendPair')) + '</span><span><i class="sw green"></i>' + esc(tx('l.legendFinal')) + '</span></div>'
      : '<div class="legend"><span><i class="sw gold"></i>' + esc(tx('l.legendQs')) + '</span><span><i class="sw blue"></i>' + esc(tx('l.legendLeft')) + '</span><span><i class="sw green"></i>' + esc(tx('l.legendFinal')) + '</span></div>';
  }

  function drawSort(f) {
    var board = $('#stage'), n = f.arr.length, W = board.clientWidth || 320, slot = W / n;
    var pw = Math.min(slot - 6, 64), mx = Math.max.apply(null, f.arr);
    board.style.height = Math.round(pw * (22 + mx * 6) / 40 + 36) + 'px';
    f.arr.forEach(function (v, i) {
      var el = L.els[v], cls = 'pgn', isSorted = f.sorted.indexOf(i) >= 0;
      el.style.width = pw + 'px';
      el.style.transform = 'translateX(' + (i * slot + (slot - pw) / 2) + 'px)';
      if (!isSorted && (i < f.lo || i > f.hi)) cls += ' dim';
      if (isSorted) cls += ' final';
      else if (i === f.cur || (f.pair && f.pair.indexOf(i) >= 0)) cls += ' cur';
      else if (i === f.pivot) cls += ' pivot';
      else if (f.left.indexOf(i) >= 0) cls += ' grp';
      el.className = cls;
      el.dataset.tag = isSorted ? '✓' : (i === f.pivot ? D.tagFor(f) : '');
    });
  }

  window.Learn = { open: open, leave: leave };
})();

<script>
/* Practice quiz: "what happens next?" questions built from the same frames as the lessons. */
(function () {
  'use strict';
  var F = window.Frames, G = window.Graphs, D = window.Draw, T = window.Content, C = window.PenguinCore;
  var tx = window.I18n.t;
  var $app = document.getElementById('app');
  var KEY = 'pengurithm-quiz-v1';
  var Q = null;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function readBest() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function writeBest(b) { try { localStorage.setItem(KEY, JSON.stringify(b)); } catch (e) {} }
  function best(kind) { var b = readBest()[kind]; return typeof b === 'number' ? b : null; }

  /** Up to six questions spread through the lesson. */
  function pick(list, max) {
    if (list.length <= max) return list;
    var out = [];
    for (var k = 0; k < max; k++) out.push(list[Math.round(k * (list.length - 1) / (max - 1))]);
    return out.filter(function (v, i) { return out.indexOf(v) === i; });
  }

  function build(kind, round) {
    var data, graph = null;
    if (kind === 'bs') data = F.bubbleFrames(F.makeArray('random', 6));
    else if (kind === 'sel') data = F.selectionFrames(F.makeArray('random', 6));
    else if (kind === 'ins') data = F.insertionFrames(F.makeArray('random', 6));
    else if (kind === 'bin') data = F.binaryFrames([1, 2, 3, 5, 6, 8, 9], [4, 1, 7, 8, 3, 9][round % 6]);
    else if (kind === 'sq') data = F.dsFrames();
    else if (F.PROG_EX[kind]) data = F.progFrames(kind, round % F.PROG_EX[kind].length);
    else if (kind === 'heap') data = F.heapFrames(F.makeArray('random', 7));
    else if (kind === 'ms') data = F.mergeFrames(F.makeArray('random', 8));
    else {
      graph = G.graphFor(kind);
      var ex = graph.examples[round % graph.examples.length];
      data = G.graphFrames(kind, graph, ex.start, ex.goal);
    }
    var qs = data.frames.filter(function (f) { return f.quiz; });
    if (kind === 'bs' || kind === 'sel' || kind === 'ins' || kind === 'bf' || kind === 'topo' || kind === 'heap' || kind === 'cond') {
      // a fair mix of "swap" and "stay" questions
      var yes = qs.filter(function (f) { return f.quiz.answer === 'yes'; }), no = qs.filter(function (f) { return f.quiz.answer === 'no'; });
      qs = pick(yes, 3).concat(pick(no, 3)).sort(function (a, b) { return qs.indexOf(a) - qs.indexOf(b); });
    } else qs = pick(qs, 6);
    return { kind: kind, graph: graph, data: data, qs: qs, i: 0, score: 0, answered: false, round: round };
  }

  function seededRandom(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /** One question for the daily puzzle. The same day always gives the same question. */
  function openDaily(kind, seed, onDone) {
    if (window.Learn) window.Learn.leave();
    var real = Math.random, rnd = seededRandom(seed);
    Math.random = rnd;
    try { Q = build(kind, seed % 5); } finally { Math.random = real; }
    Q.qs = [Q.qs[Math.floor(rnd() * Q.qs.length)]];
    Q.daily = onDone; Q.dailyInfo = null;
    $app.classList.add('wide');
    window.scrollTo(0, 0);
    render();
  }

  function open(kind, round) {
    if (window.Learn) window.Learn.leave();
    Q = build(kind, round || 0);
    $app.classList.add('wide');
    window.scrollTo(0, 0);
    render();
  }

  function leave() { Q = null; }

  function topbar(X) {
    return '<div class="topbar"><button class="icon-btn" data-act="lesson" aria-label="' + esc(tx('q.lesson')) + '">‹</button>' +
      '<div class="ttl"><b>' + esc(X.title) + '</b><small>' + esc(Q.daily ? tx('x.dailyTitle') : T.ui.quizTitle) + '</small></div><span class="topspace"></span></div>';
  }

  function render() {
    var X = T[Q.kind];
    if (Q.i >= Q.qs.length) return renderEnd(X);
    var f = Q.qs[Q.i], q = f.quiz, view = q.view || f;
    $app.innerHTML = topbar(X) + '<div class="lesson"><section class="card quiz">' +
      '<div class="qprog" aria-label="' + esc(tx('q.of', { i: Q.i + 1, n: Q.qs.length })) + '">' + Q.qs.map(function (_, k) {
        return '<i class="' + (k < Q.i ? 'done' : k === Q.i ? 'now' : '') + '"></i>';
      }).join('') + '</div>' +
      '<div class="stepno">' + esc(tx('q.of', { i: Q.i + 1, n: Q.qs.length })) + '</div>' +
      '<div class="qpic">' + D.scene(Q.kind, Q.graph, view, Q.graph ? { start: Q.data.start, goal: Q.data.goal } : {}) + '</div>' +
      '<h2 class="qtext">' + esc(q.q) + '</h2>' +
      '<div class="opts" role="group" aria-label="' + esc(tx('q.answers')) + '">' + q.options.map(function (o) {
        return '<button class="opt" data-act="pick" data-id="' + esc(o.id) + '">' + esc(o.label) + '</button>';
      }).join('') + '</div>' +
      '<div class="qfeed" id="qfeed" role="status" aria-live="polite"></div></section></div>';
    Q.answered = false;
    $app.onclick = onClick;
  }

  function onClick(e) {
    var t = e.target.closest('[data-act]'); if (!t || !Q) return;
    var a = t.dataset.act;
    if (a === 'lesson') { if (Q.daily) C.showMenu(); else window.Learn.open(Q.kind); }
    else if (a === 'pick' && !Q.answered) answer(t);
    else if (a === 'next') { Q.i++; Q.answered = false; render(); window.scrollTo(0, 0); }
    else if (a === 'again') open(Q.kind, Q.round + 1);
    else if (a === 'menu') C.showMenu();
  }

  function answer(btn) {
    var q = Q.qs[Q.i].quiz, ok = btn.dataset.id === q.answer;
    Q.answered = true;
    if (ok) Q.score++;
    if (window.Sound) window.Sound.play(ok ? 'ok' : 'no');
    if (Q.daily && !Q.dailyInfo) Q.dailyInfo = Q.daily(ok) || {};
    Array.prototype.forEach.call($app.querySelectorAll('.opt'), function (b) {
      b.disabled = true;
      if (b.dataset.id === q.answer) b.classList.add('right');
      else if (b === btn) b.classList.add('wrong');
    });
    var last = Q.i === Q.qs.length - 1;
    $('#qfeed').innerHTML = '<div class="said ' + (ok ? 'yes' : 'no') + '"><b>' + esc(tx(ok ? 'q.yes' : 'q.no')) + '</b>' + esc(q.why) + '</div>' +
      '<button class="btn primary" data-act="next">' + esc(tx(last ? 'q.score' : 'q.next')) + '</button>';
    var nx = $('#qfeed .btn'); if (nx) nx.focus();
  }
  function $(s) { return $app.querySelector(s); }

  function renderEnd(X) {
    if (Q.daily) {
      var info = Q.dailyInfo || {};
      $app.innerHTML = topbar(X) + '<div class="lesson"><section class="card quiz end"><div class="bigscore">' + (Q.score ? '★' : '☆') + '</div>' +
        '<h2 class="qtext">' + esc(tx('x.dailyEnd')) + '</h2><p class="t-white">' + esc(tx(Q.score ? 'x.dailyRight' : 'x.dailyWrong')) + '</p>' +
        (info.streak ? '<p class="t-pink"><b>' + esc(tx(info.streak === 1 ? 'x.streak1' : 'x.streakN', { n: info.streak })) + '</b></p>' : '') +
        '<div class="endbtns"><button class="btn primary" data-act="menu">' + esc(tx('q.menu')) + '</button></div></section></div>';
      if (window.Sound && Q.score) window.Sound.play('win');
      return;
    }
    var n = Q.qs.length, pct = n ? Q.score / n : 0;
    var msg = pct === 1 ? tx('q.perfect', { name: X.short }) : pct >= 0.6 ? tx('q.great') : tx('q.try');
    var b = readBest(); if (typeof b[Q.kind] !== 'number' || Q.score > b[Q.kind]) { b[Q.kind] = Q.score; writeBest(b); }
    $app.innerHTML = topbar(X) + '<div class="lesson"><section class="card quiz end"><div class="bigscore">' + Q.score + ' / ' + n + '</div>' +
      '<div class="stars">' + '★'.repeat(Math.round(pct * 3)) + '☆'.repeat(3 - Math.round(pct * 3)) + '</div><p class="t-white">' + esc(msg) + '</p>' +
      '<div class="endbtns"><button class="btn primary" data-act="again">' + esc(tx('q.again')) + '</button><button class="ghost" data-act="lesson">' + esc(tx('q.lesson')) + '</button><button class="ghost" data-act="menu">' + esc(tx('q.menu')) + '</button></div></section></div>';
  }

  window.Quiz = { openDaily: openDaily, open: open, leave: leave, best: best };
})();

</script>
<script>
/* Extras on the menu: the daily puzzle with a streak, and a printable certificate with the student's name. */
(function () {
  'use strict';
  var T = window.Content, D = window.Draw, C = window.PenguinCore, tx = window.I18n.t;
  var $app = document.getElementById('app');
  var DAILY_KEY = 'pengurithm-daily-v1', NAME_KEY = 'pengurithm-name';

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function store(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  function put(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dateStr(new Date()); }
  function yesterday() { var d = new Date(); d.setDate(d.getDate() - 1); return dateStr(d); }
  function hash(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  /* ---------- Daily puzzle ---------- */
  function dailyState() {
    var s = store(DAILY_KEY) || { last: '', streak: 0 };
    var alive = s.last === today() || s.last === yesterday();
    return { doneToday: s.last === today(), streak: alive ? s.streak : 0, raw: s };
  }
  function recordDaily() {
    var st = dailyState();
    if (!st.doneToday) {
      var streak = st.raw.last === yesterday() ? st.raw.streak + 1 : 1;
      put(DAILY_KEY, { last: today(), streak: streak });
      return { streak: streak };
    }
    return { streak: st.streak };
  }
  function openDaily() {
    var kinds = T.order;
    var seed = hash(today());
    window.Quiz.openDaily(kinds[seed % kinds.length], seed, function () { return recordDaily(); });
  }

  function dailyCard() {
    var st = dailyState();
    return '<section class="card extra"><div><h2>' + esc(tx('x.dailyTitle')) + '</h2><p class="blurb">' + esc(tx(st.doneToday ? 'x.dailyDone' : 'x.dailyText')) +
      (st.streak ? ' <b>' + esc(tx(st.streak === 1 ? 'x.streak1' : 'x.streakN', { n: st.streak })) + '</b>' : '') + '</p></div>' +
      '<button class="btn ' + (st.doneToday ? '' : 'primary') + '" data-act="daily">' + esc(tx(st.doneToday ? 'x.dailyAgain' : 'x.dailyPlay')) + '</button></section>';
  }

  /* ---------- Certificate ---------- */
  function tierOf(n, total) { return n >= total && total > 0 ? 4 : n >= 8 ? 3 : n >= 3 ? 2 : 1; }

  function certificateCard(done, total) {
    if (!done.length) {
      return '<section class="card extra"><div><h2>' + esc(tx('x.certTitle')) + '</h2><p class="blurb">' + esc(tx('x.certNone')) + '</p></div></section>';
    }
    return '<section class="card extra"><div><h2>' + esc(tx('x.certTitle')) + '</h2><p class="blurb">' + esc(tx('x.certProgress', { n: done.length, m: total })) + '</p></div>' +
      '<button class="btn primary" data-act="cert">' + esc(tx('x.certGet')) + '</button></section>';
  }

  function certSVG(name, done, total) {
    var tier = tierOf(done.length, total), nm = name.trim() || '________________';
    var size = nm.length > 26 ? 26 : nm.length > 18 ? 34 : 44;
    var names = done.map(function (c) { return T[c].short; });
    var list = names.length > 6 ? names.slice(0, 6).join(', ') + ' …' : names.join(', ');
    var lang = window.I18n.lang(), loc = lang === 'el' ? 'el-GR' : 'en-GB', when = new Date().toLocaleDateString(loc, { year: 'numeric', month: 'long', day: 'numeric' });
    var F = 'font-family="Georgia, \'Times New Roman\', serif"', G = 'font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif"';
    return '<svg id="certsvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="' + esc(tx('x.certHeading')) + '">' +
      '<rect width="800" height="560" fill="#fffdf5"/>' +
      '<rect x="14" y="14" width="772" height="532" rx="18" fill="none" stroke="#17304d" stroke-width="6"/>' +
      '<rect x="28" y="28" width="744" height="504" rx="12" fill="none" stroke="#e8a317" stroke-width="2.5"/>' +
      '<g transform="translate(360 52) scale(1.8)">' + D.penguinParts(3, true) + '</g>' +
      '<text x="400" y="190" text-anchor="middle" ' + F + ' font-size="40" font-weight="700" fill="#17304d">' + esc(tx('x.certHeading')) + '</text>' +
      '<text x="400" y="232" text-anchor="middle" ' + G + ' font-size="18" fill="#5b6b7d">' + esc(tx('x.certAward')) + '</text>' +
      '<text x="400" y="296" text-anchor="middle" ' + F + ' font-size="' + size + '" font-style="italic" font-weight="700" fill="#b86e00">' + esc(nm) + '</text>' +
      '<line x1="170" y1="312" x2="630" y2="312" stroke="#17304d" stroke-width="1.5"/>' +
      '<text x="400" y="352" text-anchor="middle" ' + G + ' font-size="20" fill="#17304d">' + esc(tx('x.certDid', { n: done.length })) + '</text>' +
      '<text x="400" y="384" text-anchor="middle" ' + G + ' font-size="14" fill="#5b6b7d">' + esc(list) + '</text>' +
      '<rect x="270" y="410" width="260" height="44" rx="22" fill="#17304d"/>' +
      '<text x="400" y="439" text-anchor="middle" ' + G + ' font-size="20" font-weight="700" fill="#ffcf3f">' + esc(tx('x.certTier' + tier)) + '</text>' +
      '<text x="90" y="506" ' + G + ' font-size="15" fill="#17304d">' + esc(tx('x.certDate')) + ': ' + esc(when) + '</text>' +
      '<text x="710" y="506" text-anchor="end" ' + G + ' font-size="18" font-weight="800" fill="#17304d">CS Penguins</text>' +
      '</svg>';
  }

  function openCertificate() {
    var done = C.doneChapters(), total = T.order.length;
    var saved = store(NAME_KEY) || '';
    $app.classList.remove('wide');
    $app.innerHTML = '<div class="topbar"><button class="icon-btn" data-act="menu" aria-label="' + esc(tx('x.certBack')) + '">‹</button><div class="ttl"><b>' + esc(tx('x.certTitle')) + '</b></div><span class="topspace"></span></div>' +
      '<div class="lesson"><section class="certwrap" id="certbox">' + certSVG(saved, done, total) + '</section>' +
      '<section class="card certui"><label class="numlabel" for="certname">' + esc(tx('x.certName')) + '</label>' +
      '<div class="numrow"><input id="certname" type="text" maxlength="40" autocomplete="off" placeholder="' + esc(tx('x.certNamePh')) + '" value="' + esc(saved) + '"></div>' +
      '<div class="row"><button class="btn primary" data-act="certsave">' + esc(tx('x.certSave')) + '</button><button class="btn" data-act="certprint">' + esc(tx('x.certPrint')) + '</button></div>' +
      '<p class="hint" id="certmsg" role="status"></p></section></div>';
    window.scrollTo(0, 0);
    $app.oninput = function (e) {
      if (e.target.id !== 'certname') return;
      var v = e.target.value.slice(0, 40);
      put(NAME_KEY, v);
      document.getElementById('certbox').innerHTML = certSVG(v, done, total);
    };
    $app.onclick = function (e) {
      var t = e.target.closest('[data-act]'); if (!t) return;
      if (t.dataset.act === 'menu') { $app.oninput = null; C.showMenu(); }
      else if (t.dataset.act === 'certprint') { try { window.print(); } catch (err) {} }
      else if (t.dataset.act === 'certsave') savePNG();
    };
  }

  function savePNG() {
    var svg = document.getElementById('certsvg'), msg = document.getElementById('certmsg');
    try {
      var xml = new XMLSerializer().serializeToString(svg), img = new Image();
      img.onload = function () {
        try {
          var c = document.createElement('canvas'); c.width = 1600; c.height = 1120;
          c.getContext('2d').drawImage(img, 0, 0, 1600, 1120);
          c.toBlob(function (b) {
            if (!b) { if (msg) msg.textContent = tx('x.certFail'); return; }
            var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'cs-penguins-certificate.png';
            document.body.appendChild(a); a.click(); a.remove();
            if (msg) msg.textContent = tx('x.certSaved');
          }, 'image/png');
        } catch (err) { if (msg) msg.textContent = tx('x.certFail'); }
      };
      img.onerror = function () { if (msg) msg.textContent = tx('x.certFail'); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    } catch (err) { if (msg) msg.textContent = tx('x.certFail'); }
  }

  /* ---------- Menu hooks ---------- */
  function cards(done, total) { return '<div class="extras">' + dailyCard() + certificateCard(done, total) + '</div>'; }
  function handle(act) {
    if (act === 'daily') { openDaily(); return true; }
    if (act === 'cert') { openCertificate(); return true; }
    return false;
  }

  window.Extras = { cards: cards, handle: handle, today: today, tierOf: tierOf, hash: hash };
})();

</script>
